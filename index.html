<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ห้องเตรียมสอบ ม.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@600;700;800&family=Sarabun:wght@400;500;600;700&display=swap');

:root{
  --board:#173d2e;
  --board-dark:#0f2b21;
  --chalk:#f4e9d8;
  --marigold:#f2a71b;
  --marigold-dark:#c9860c;
  --paper:#fffdf6;
  --paper-line:#e4dcc6;
  --ink:#26261f;
  --ink-soft:#5b5b4f;
  --good:#2d6a4f;
  --bad:#c1121f;
  --ring:#173d2e;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Sarabun',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 8%, rgba(244,233,216,0.05), transparent 40%),
    var(--board);
  min-height:100vh;
}
#app{max-width:820px;margin:0 auto;padding:18px 16px 60px;}

h1,h2,h3{font-family:'Kanit',sans-serif;margin:0;}

/* Header */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 4px 22px;color:var(--chalk);
}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.topbar .right{display:flex;align-items:center;gap:8px;}
.topbar .brand-mark{
  width:34px;height:34px;border-radius:8px;background:var(--marigold);
  display:flex;align-items:center;justify-content:center;
  font-family:'Kanit';font-weight:800;color:var(--board-dark);font-size:16px;
  transform:rotate(-4deg);
}
.topbar h1{font-size:19px;color:var(--chalk);letter-spacing:.2px;}
.student-chip{
  font-size:12.5px;color:var(--chalk);opacity:.85;background:rgba(255,255,255,.08);
  padding:6px 12px;border-radius:999px;cursor:pointer;border:1px solid rgba(255,255,255,.15);
}
.parent-link{
  width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;
}
.parent-link:hover{background:rgba(255,255,255,.16);}

/* Notebook card w/ binder holes */
.card{
  background:var(--paper);
  border-radius:14px;
  position:relative;
  padding:22px 22px 22px 40px;
  margin-bottom:16px;
  box-shadow:0 10px 24px rgba(0,0,0,.18);
}
.card::before{
  content:'';position:absolute;left:14px;top:16px;bottom:16px;width:2px;
  background:repeating-linear-gradient(to bottom, transparent 0 6px, var(--paper-line) 6px 8px);
}
.card .holes{position:absolute;left:2px;top:0;bottom:0;width:24px;display:flex;flex-direction:column;justify-content:space-evenly;padding:14px 0;}
.card .holes span{width:11px;height:11px;border-radius:50%;background:var(--board);box-shadow:inset 0 0 0 2px rgba(0,0,0,.15);margin:0 auto;}

.btn{
  font-family:'Sarabun';font-weight:600;font-size:14.5px;
  border:none;border-radius:9px;padding:10px 18px;cursor:pointer;
  transition:transform .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--marigold);color:var(--board-dark);}
.btn-primary:hover{background:var(--marigold-dark);}
.btn-dark{background:var(--board);color:var(--chalk);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--paper-line);}
.btn-danger{background:#fbe3e3;color:var(--bad);}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.row{display:flex;gap:10px;flex-wrap:wrap;}
input[type=text],input[type=password]{
  font-family:'Sarabun';font-size:15px;padding:11px 14px;border-radius:9px;
  border:1.5px solid var(--paper-line);width:100%;
}
input:focus{outline:2px solid var(--marigold);outline-offset:1px;}
label{font-size:13px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:5px;}

.subtitle{color:var(--chalk);opacity:.8;font-size:13.5px;margin-top:4px;}

/* Subject grid */
.subject-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.subject-grid{grid-template-columns:1fr;}}
.subject-card{
  background:var(--paper);border-radius:14px;padding:18px;cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,.15);border:2px solid transparent;
  transition:border-color .15s, transform .12s;
}
.subject-card:hover{border-color:var(--marigold);transform:translateY(-2px);}
.subject-card .tag{font-size:11.5px;color:var(--good);font-weight:700;letter-spacing:.4px;}
.subject-card h3{font-size:18px;margin-top:4px;}
.subject-card .count{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}

.topic-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 14px;border-radius:10px;background:var(--paper);
  margin-bottom:9px;box-shadow:0 4px 10px rgba(0,0,0,.08);cursor:pointer;
  border:2px solid transparent;
}
.topic-item:hover{border-color:var(--marigold);}
.topic-item .num{
  width:26px;height:26px;border-radius:7px;background:var(--board);color:var(--chalk);
  font-family:'Kanit';font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-right:10px;
}
.topic-item .name{font-weight:600;font-size:15px;flex:1;}
.topic-item .go{color:var(--marigold-dark);font-size:13px;font-weight:700;}

.mode-pick{display:flex;gap:12px;margin-top:6px;}
.mode-card{
  flex:1;background:var(--paper);border-radius:14px;padding:20px 16px;text-align:center;
  cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.15);border:2px solid transparent;
}
.mode-card:hover{border-color:var(--marigold);}
.mode-card .ic{font-size:26px;}
.mode-card h3{margin-top:8px;font-size:16px;}
.mode-card p{font-size:12.5px;color:var(--ink-soft);margin:4px 0 0;}

/* Question player */
.progress-track{height:6px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-bottom:16px;}
.progress-fill{height:100%;background:var(--marigold);transition:width .25s;}
.q-meta{display:flex;justify-content:space-between;align-items:center;color:var(--chalk);font-size:13px;margin-bottom:10px;}
.q-meta b{color:var(--marigold);}

.q-text{font-size:16.5px;line-height:1.65;font-weight:500;}
.q-svg{margin:14px 0;text-align:center;}
.q-svg svg{max-width:100%;height:auto;background:#fbfaf3;border-radius:10px;padding:8px;}

.choice{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border:1.5px solid var(--paper-line);
  border-radius:10px;margin-top:9px;cursor:pointer;
}
.choice:hover{border-color:var(--marigold);}
.choice.selected{border-color:var(--marigold-dark);background:#fff6e2;}
.choice input{accent-color:var(--marigold-dark);}

/* scratch pad */
.scratch-wrap{
  margin-top:18px;background:#f6f2e4;border-radius:12px;border:1.5px dashed var(--paper-line);padding:10px;
}
.scratch-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.scratch-head .lbl{font-size:12.5px;font-weight:700;color:var(--ink-soft);}
.scratch-tools{display:flex;gap:6px;}
.tool-btn{
  width:34px;height:34px;border-radius:8px;border:1.5px solid var(--paper-line);background:#fff;cursor:pointer;
  font-size:15px;display:flex;align-items:center;justify-content:center;
}
.tool-btn.active{background:var(--marigold);border-color:var(--marigold-dark);}
.tool-btn:disabled{opacity:.4;cursor:not-allowed;}
canvas.pad{width:100%;display:block;background:#fffdf6;touch-action:none;}
.pad-scroll{height:480px;overflow-y:auto;overflow-x:hidden;border-radius:9px;border:1px solid var(--paper-line);background:#fffdf6;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#d8cfa8 transparent;}
.pad-scroll::-webkit-scrollbar{width:8px;}
.pad-scroll::-webkit-scrollbar-track{background:transparent;}
.pad-scroll::-webkit-scrollbar-thumb{background:#d8cfa8;border-radius:8px;}
.save-hint{font-size:11px;color:var(--ink-soft);opacity:.75;margin-top:5px;text-align:right;}

.answer-box{margin-top:16px;}
.reveal-panel{margin-top:14px;padding:14px;border-radius:10px;font-size:14.5px;line-height:1.6;}
.reveal-panel.correct{background:#e7f5ec;border:1.5px solid var(--good);}
.reveal-panel.incorrect{background:#fbe9e9;border:1.5px solid var(--bad);}
.reveal-panel .verdict{font-family:'Kanit';font-weight:700;font-size:15px;margin-bottom:6px;}
.reveal-panel.correct .verdict{color:var(--good);}
.reveal-panel.incorrect .verdict{color:var(--bad);}
.reveal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.reveal-close{
  flex-shrink:0;background:rgba(0,0,0,.06);border:none;border-radius:7px;padding:4px 10px;
  font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;
}
.reveal-close:hover{background:rgba(0,0,0,.12);}
.explain-text{white-space:pre-line;line-height:1.7;}
.explain-text .method-label{display:block;font-family:'Kanit';font-weight:700;font-size:13px;color:var(--board);margin:10px 0 3px;}
.explain-text .method-label:first-child{margin-top:0;}
.reveal-reopen-btn{width:100%;}

.nav-row{display:flex;justify-content:space-between;margin-top:18px;}

/* pin modal */
.overlay{position:fixed;inset:0;background:rgba(15,25,20,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.pin-box{background:var(--paper);border-radius:14px;padding:22px;width:100%;max-width:300px;text-align:center;}
.pin-box h3{font-size:16px;margin-bottom:4px;}
.pin-box p{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;}
.pin-box input{text-align:center;letter-spacing:6px;font-size:18px;}
.pin-error{color:var(--bad);font-size:12.5px;margin-top:8px;min-height:16px;}

.exam-list-item{background:var(--paper);border-radius:12px;padding:16px;margin-bottom:12px;}
.exam-list-item .q-num{font-family:'Kanit';font-weight:700;font-size:12.5px;color:var(--marigold-dark);}
.score-hero{
  text-align:center;padding:26px 16px;background:var(--paper);border-radius:16px;margin-bottom:16px;
}
.score-hero .big{font-family:'Kanit';font-size:44px;font-weight:800;color:var(--board);}
.score-hero .sub{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}

.empty{color:var(--chalk);opacity:.8;font-size:14px;text-align:center;padding:30px 10px;}
.loading{color:var(--chalk);opacity:.8;text-align:center;padding:30px 10px;font-size:14px;}
.link-back{color:var(--chalk);opacity:.85;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;margin-bottom:12px;}
.link-back:hover{opacity:1;}

.config-note{font-size:12.5px;color:var(--ink-soft);background:#fff6e2;border:1px solid #f0dca4;padding:10px 12px;border-radius:9px;margin-bottom:14px;line-height:1.55;}
.name-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.name-chip{
  font-family:'Sarabun';font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;
  background:#fff;border:1.5px solid var(--paper-line);cursor:pointer;color:var(--ink);
}
.name-chip:hover{border-color:var(--marigold-dark);background:#fff6e2;}

/* math typography: stacked fractions + superscript exponents */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:-0.35em;margin:0 3px;line-height:1.05;font-size:0.92em;}
.frac .num{padding:0 4px 1px;border-bottom:1.6px solid currentColor;}
.frac .den{padding:1px 4px 0;}
sup{font-size:0.66em;font-weight:700;top:-0.55em;}

/* progress badges */
.topic-item{align-items:center;}
.topic-item .meta-wrap{flex:1;}
.progress-pills{display:flex;gap:6px;margin-top:5px;}
.pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#f1ede0;color:var(--ink-soft);}
.pill.done{background:#e7f5ec;color:var(--good);}
.mode-card .prog-pill{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:#f1ede0;color:var(--ink-soft);}
.mode-card .prog-pill.done{background:#e7f5ec;color:var(--good);}
.reset-link{text-align:center;margin-top:18px;}
.reset-link a{color:var(--chalk);opacity:.65;font-size:12px;cursor:pointer;text-decoration:underline;}
.reset-link a:hover{opacity:.95;}

/* scratch pad: prevent native selection/scroll interference */
.scratch-wrap, .scratch-wrap *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
canvas.pad{touch-action:none;}
</style>
</head>
<body>
<div id="app"></div>

<script>
let PIN = "123"; // loaded from Supabase at startup; changeable from the parent dashboard
const DEFAULT_SUPABASE = {
  url: "https://mbwkslgkiiqpfeqslqcu.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1id2tzbGdraWlxcGZlcXNscWN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDMwNDEsImV4cCI6MjEwMjE3OTA0MX0.WVreyl-NVB3_uHxS4yVeDyey17YWdN99eBjcpv9YmGk"
};
let cfg = null;                 // {url, key}
let studentName = "";
let state = {
  screen: "loading",           // loading | config | name | home | topic | player | examresult
  subjects: [], topics: [],
  currentSubject: null, currentTopic: null, currentMode: null, // 'exercise' | 'exam'
  questions: [], idx: 0,
  answers: {},                 // questionId -> submitted answer (exam mode)
  revealed: {},                // questionId -> {correct, explanation shown}
  revealOpen: {},              // questionId -> whether the reveal panel is currently expanded (session only)
  examSubmitted: false, examScore: null,
  topicStats: {},              // topic_id -> {exercise:{done,total}, exam:{done,total}}
  parentStudent: null,
  parentData: null,
};

const app = document.getElementById('app');

// ---------- storage helpers ----------
async function loadPersisted(key){
  try{ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function savePersisted(key, val){
  try{ await window.storage.set(key, JSON.stringify(val)); }catch(e){}
}

// ---------- supabase REST helpers ----------
function sbHeaders(extra){
  return Object.assign({
    'apikey': cfg.key,
    'Authorization': 'Bearer ' + cfg.key,
    'Content-Type': 'application/json'
  }, extra||{});
}
async function sbGet(path){
  const res = await fetch(`${cfg.url}/rest/v1/${path}`, { headers: sbHeaders() });
  if(!res.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ (' + res.status + ')');
  return res.json();
}
async function sbUpsert(table, body, conflictCols){
  const res = await fetch(`${cfg.url}/rest/v1/${table}?on_conflict=${conflictCols}`, {
    method:'POST',
    headers: sbHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body: JSON.stringify(body)
  });
  if(!res.ok){ const t = await res.text(); throw new Error('บันทึกไม่สำเร็จ: '+t); }
}
async function sbInsert(table, body){
  const res = await fetch(`${cfg.url}/rest/v1/${table}`, {
    method:'POST',
    headers: sbHeaders({'Prefer':'return=minimal'}),
    body: JSON.stringify(body)
  });
  if(!res.ok){ const t = await res.text(); throw new Error('บันทึกไม่สำเร็จ: '+t); }
}

async function sbDelete(path){
  const res = await fetch(`${cfg.url}/rest/v1/${path}`, { method:'DELETE', headers: sbHeaders({'Prefer':'return=minimal'}) });
  if(!res.ok){ const t = await res.text(); throw new Error('ลบไม่สำเร็จ: '+t); }
}

// topic_id -> {exercise:{done,total}, exam:{done,total}}
async function fetchTopicStats(topics){
  const stats = {};
  topics.forEach(t=> stats[t.id] = {exercise:{done:0,total:0}, exam:{done:0,total:0}});
  const topicIds = topics.map(t=>t.id);
  if(topicIds.length===0) return stats;
  const questions = await sbGet(`questions?topic_id=in.(${topicIds.join(',')})&select=id,topic_id,mode`);
  questions.forEach(q=>{ if(stats[q.topic_id]) stats[q.topic_id][q.mode].total++; });
  if(studentName){
    const qMap = {}; questions.forEach(q=>{ qMap[q.id]=q; });
    // fetch by student only (no per-question id list) so the URL never grows with the size of the question bank
    const rows = await sbGet(`progress?student_name=eq.${encodeURIComponent(studentName)}&submitted_answer=not.is.null&select=question_id`);
    rows.forEach(r=>{ const q = qMap[r.question_id]; if(q && stats[q.topic_id]) stats[q.topic_id][q.mode].done++; });
  }
  return stats;
}

// ---------- init ----------
async function init(){
  cfg = await loadPersisted('supabase_config');
  if(!cfg || !cfg.url || !cfg.key){ cfg = DEFAULT_SUPABASE; }
  try{
    const rows = await sbGet('app_settings?id=eq.1&select=pin');
    if(rows && rows[0] && rows[0].pin) PIN = rows[0].pin;
  }catch(e){ /* fall back to default PIN if this fails */ }
  const nm = await loadPersisted('student_name');
  studentName = nm || "";
  if(!studentName){ state.screen='name'; render(); return; }
  await goHome();
}

async function goHome(){
  state.screen = 'loading'; render();
  try{
    const [subjects, topics] = await Promise.all([
      sbGet('subjects?select=*&order=order_no'),
      sbGet('topics?select=*&order=order_no'),
    ]);
    state.subjects = subjects; state.topics = topics;
    try{ state.topicStats = Object.assign({}, state.topicStats, await fetchTopicStats(topics)); }catch(e){ /* stats are best-effort */ }
    state.screen = 'home';
  }catch(e){
    state.screen = 'error'; state.errorMsg = e.message;
  }
  render();
}

// ---------- screen renderers ----------
function render(){
  app.innerHTML = '';
  if(state.screen === 'loading'){ app.innerHTML = `<div class="loading">กำลังโหลด...</div>`; return; }
  if(state.screen === 'error'){
    app.innerHTML = `<div class="card"><h3>โหลดข้อมูลไม่สำเร็จ</h3><p style="color:var(--ink-soft);font-size:14px">${escapeHtml(state.errorMsg||'')}</p>
      <div class="row" style="margin-top:12px">
        <button class="btn btn-dark" id="retry">ลองใหม่</button>
        <button class="btn btn-ghost" id="reconfig">แก้ไขการเชื่อมต่อ Supabase</button>
      </div></div>`;
    document.getElementById('retry').onclick = goHome;
    document.getElementById('reconfig').onclick = ()=>{ state.screen='config'; render(); };
    return;
  }
  renderTopbar();
  if(state.screen === 'config') return renderConfig();
  if(state.screen === 'name') return renderName();
  if(state.screen === 'home') return renderHomeScreen();
  if(state.screen === 'topic') return renderTopicScreen();
  if(state.screen === 'modepick') return renderModePick();
  if(state.screen === 'player') return renderPlayer();
  if(state.screen === 'examresult') return renderExamResult();
  if(state.screen === 'parent') return renderParentDashboard();
}

function renderTopbar(){
  const bar = document.createElement('div');
  bar.className = 'topbar';
  bar.innerHTML = `
    <div class="brand">
      <div class="brand-mark">ม.1</div>
      <div><h1>ห้องเตรียมสอบเข้า ม.1</h1><div class="subtitle" style="margin:0">ฝึกทำโจทย์ + ข้อสอบจำลอง</div></div>
    </div>
    <div class="right">
      ${studentName ? `<div class="student-chip" id="chip">👤 ${escapeHtml(studentName)}</div>` : ''}
      <div class="parent-link" id="parent-link" title="สำหรับผู้ปกครอง/ครู">📊</div>
    </div>
  `;
  app.appendChild(bar);
  document.getElementById('parent-link').onclick = ()=>{
    askPinThen(()=>{ state.screen='parent'; state.parentStudent = state.parentStudent || studentName; openParentDashboard(); });
  };
  const chip = document.getElementById('chip');
  if(chip) chip.onclick = ()=>{ state.screen='name'; render(); };
}

function renderConfig(){
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `
    <div class="holes"><span></span><span></span><span></span><span></span></div>
    <h2>เชื่อมต่อฐานข้อมูล Supabase</h2>
    <p class="config-note">
      ไปที่โปรเจกต์ Supabase ของคุณ → <b>Settings → API</b> แล้วคัดลอก <b>Project URL</b> และ <b>anon public key</b> มาวางด้านล่าง
      (ต้องรันไฟล์ schema.sql ในโปรเจกต์นั้นก่อนอย่างน้อย 1 ครั้ง)
    </p>
    <label>Project URL</label>
    <input type="text" id="cfg-url" placeholder="https://xxxxxxxx.supabase.co" value="${cfg && cfg.url ? escapeHtml(cfg.url) : ''}">
    <div style="height:12px"></div>
    <label>anon public key</label>
    <input type="text" id="cfg-key" placeholder="eyJhbGciOi..." value="${cfg && cfg.key ? escapeHtml(cfg.key) : ''}">
    <div style="height:16px"></div>
    <div class="row"><button class="btn btn-primary" id="cfg-save">บันทึกและเชื่อมต่อ</button></div>
    <div class="pin-error" id="cfg-err"></div>
  `;
  app.appendChild(c);
  document.getElementById('cfg-save').onclick = async ()=>{
    const url = document.getElementById('cfg-url').value.trim().replace(/\/+$/,'');
    const key = document.getElementById('cfg-key').value.trim();

    cfg = { url, key };
    await savePersisted('supabase_config', cfg);
    if(!studentName){ state.screen='name'; render(); } else { await goHome(); }
  };
}

function renderHomeScreen(){
  const wrap = document.createElement('div');

  // overall progress across every subject, for this student — best-effort, never blocks the page below
  try{
    let overallDone=0, overallTotal=0;
    Object.values(state.topicStats||{}).forEach(st=>{
      overallDone += st.exercise.done + st.exam.done;
      overallTotal += st.exercise.total + st.exam.total;
    });
    if(overallTotal > 0){
      const hero = document.createElement('div'); hero.className='score-hero';
      const pct = Math.round(overallDone/overallTotal*100);
      hero.innerHTML = `<div class="big">${overallDone}/${overallTotal}</div>
        <div class="sub">ความคืบหน้ารวมทุกวิชาของ ${escapeHtml(studentName)} — ${pct}%</div>`;
      wrap.appendChild(hero);
    }
  }catch(e){ /* progress summary is a nice-to-have; the subject grid below must still show */ }

  const grid = document.createElement('div');
  grid.className = 'subject-grid';
  state.subjects.forEach(s=>{
    const topicsOf = state.topics.filter(t=>t.subject_id===s.id);
    let donePill = '';
    try{
      let sDone=0, sTotal=0;
      topicsOf.forEach(t=>{
        const st = state.topicStats && state.topicStats[t.id];
        if(st){ sDone += st.exercise.done + st.exam.done; sTotal += st.exercise.total + st.exam.total; }
      });
      if(sTotal>0) donePill = `<div class="progress-pills"><span class="pill ${sDone>=sTotal?'done':''}">ทำแล้ว ${sDone}/${sTotal} ข้อ</span></div>`;
    }catch(e){ /* fall back to no progress pill for this subject */ }
    const card = document.createElement('div');
    card.className = 'subject-card';
    card.innerHTML = `<div class="tag">${topicsOf.length} เรื่อง</div><h3>${escapeHtml(s.name_th)}</h3>
      <div class="count">แบบฝึกหัด + ข้อสอบจำลอง</div>${donePill}`;
    card.onclick = ()=>goToTopicScreen(s);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  app.appendChild(wrap);
}

async function goToTopicScreen(subject){

  state.screen = 'loading'; render();
  try{ state.topicStats = Object.assign({}, state.topicStats, await fetchTopicStats(topicsOf)); }catch(e){ /* stats are best-effort */ }

}

async function resetTopicProgress(topic){
  try{
    const qs = await sbGet(`questions?topic_id=eq.${topic.id}&select=id`);
    const qids = qs.map(q=>q.id);
    if(qids.length){
      await sbDelete(`progress?student_name=eq.${encodeURIComponent(studentName)}&question_id=in.(${qids.join(',')})`);
      await sbDelete(`scratch_pads?student_name=eq.${encodeURIComponent(studentName)}&question_id=in.(${qids.join(',')})`);
    }
    await sbDelete(`exam_results?student_name=eq.${encodeURIComponent(studentName)}&topic_id=eq.${topic.id}`);
    state.topicStats = Object.assign({}, state.topicStats, await fetchTopicStats([topic]));
    alert('ล้างความคืบหน้าเรียบร้อยแล้ว');
    render();
  }catch(e){ alert('ล้างไม่สำเร็จ: '+e.message); }
}

async function startMode(mode){
  state.currentMode = mode;
  state.screen = 'loading'; render();
  try{
    const qs = await sbGet(`questions?topic_id=eq.${state.currentTopic.id}&mode=eq.${mode}&select=*&order=order_no`);
    state.questions = qs;
    state.idx = 0;
    state.answers = {};
    state.revealed = {};
    state.examSubmitted = false;
    state.examScore = null;
    if(qs.length === 0){ state.screen='topic'; render(); alert('ยังไม่มีข้อในหมวดนี้ เพิ่มเนื้อหาได้ในตาราง questions ของ Supabase'); return; }
    // restore previously-saved answers / reveal state so nothing is lost between visits
    const qids = qs.map(q=>q.id);
    try{
      const rows = await sbGet(`progress?student_name=eq.${encodeURIComponent(studentName)}&question_id=in.(${qids.join(',')})&mode=eq.${mode}&select=question_id,submitted_answer,revealed`);
      rows.forEach(r=>{
        if(r.submitted_answer!==null && r.submitted_answer!==undefined) state.answers[r.question_id] = r.submitted_answer;
        if(r.revealed) state.revealed[r.question_id] = true;
      });
      if(mode==='exam' && qids.length && rows.length===qids.length && rows.every(r=>r.revealed)){
        // whole exam was already reviewed previously; recompute a score summary
        let correct = 0;
        qs.forEach(q=>{ if(normalize(state.answers[q.id])===normalize(q.correct_answer)) correct++; });
        state.examSubmitted = true;
        state.examScore = { correct, total: qs.length };
      }
    }catch(e){ /* best-effort restore */ }
    state.screen = 'player';
  }catch(e){ state.screen='error'; state.errorMsg = e.message; }
  render();
}

function renderAnswerBox(q){
  const box = document.getElementById('answer-box');
  const saved = state.answers[q.id] !== undefined ? state.answers[q.id] : '';
  if(q.choices){
    const choices = q.choices;
    box.innerHTML = choices.map((c,i)=>`
      <label class="choice ${saved===c?'selected':''}" data-c="${escapeHtml(c)}">
        <input type="radio" name="choice" value="${escapeHtml(c)}" ${saved===c?'checked':''}>
        <span>${formatMath(c)}</span>
      </label>`).join('');
    box.querySelectorAll('.choice').forEach(el=>{
      el.onclick = ()=>{
        state.answers[q.id] = el.dataset.c;
        box.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
        el.classList.add('selected');
        el.querySelector('input').checked = true;
        saveProgressDebounced(q, state.answers[q.id], !!state.revealed[q.id]);
      };
    });
    if(state.currentMode==='exercise'){
      const btn = document.createElement('button');
      btn.className='btn btn-primary'; btn.style.marginTop='12px'; btn.textContent='ดูเฉลย (ใส่รหัส)';
      btn.onclick = ()=>askPinThen(()=>revealAnswer(q));
      box.appendChild(btn);
    }
  } else {
    box.innerHTML = `<input type="text" id="fill-ans" placeholder="พิมพ์คำตอบที่นี่" value="${escapeHtml(saved)}">`;
    const inp = document.getElementById('fill-ans');
    inp.oninput = ()=>{ state.answers[q.id] = inp.value; saveProgressDebounced(q, inp.value, !!state.revealed[q.id]); };
    if(state.currentMode==='exercise'){
      const btn = document.createElement('button');
      btn.className='btn btn-primary'; btn.style.marginTop='12px'; btn.textContent='ดูเฉลย (ใส่รหัส)';
      btn.onclick = ()=>askPinThen(()=>revealAnswer(q));
      box.appendChild(btn);
    }
  }
  // restore reveal panel if already revealed this session
  if(state.revealed[q.id]){
    if(state.revealOpen[q.id] !== false) paintRevealPanel(q);
    else paintRevealClosed(q);
  }
}

function paintRevealPanel(q){
  const panel = document.getElementById('reveal-panel');
  const submitted = (state.answers[q.id]||'').toString().trim();
  const isCorrect = normalize(submitted) === normalize(q.correct_answer);
  state.revealOpen[q.id] = true;
  panel.innerHTML = `
    <div class="reveal-panel ${isCorrect?'correct':'incorrect'}">
      <div class="reveal-top">
        <div class="verdict">${isCorrect ? '✓ ถูกต้อง!' : '✗ ยังไม่ถูก'} — เฉลย: ${formatMath(q.correct_answer)}</div>
        <button class="reveal-close" id="reveal-close-btn" title="ปิดเฉลย">✕ ปิด</button>
      </div>
      <div class="explain-text">${formatMath(q.explanation)}</div>
      ${q.explanation_svg ? `<div class="q-svg">${q.explanation_svg}</div>` : ''}
    </div>`;
  document.getElementById('reveal-close-btn').onclick = ()=>{ state.revealOpen[q.id] = false; paintRevealClosed(q); };
}

function paintRevealClosed(q){
  const panel = document.getElementById('reveal-panel');
  panel.innerHTML = `<button class="btn btn-ghost reveal-reopen-btn">👁️ แสดงเฉลยอีกครั้ง</button>`;
  panel.querySelector('.reveal-reopen-btn').onclick = ()=>{ state.revealOpen[q.id] = true; paintRevealPanel(q); };
}

async function revealAnswer(q){
  state.revealed[q.id] = true;
  paintRevealPanel(q);
  const submitted = (state.answers[q.id]||'').toString().trim();
  const isCorrect = normalize(submitted) === normalize(q.correct_answer);
  clearTimeout(progressTimers[q.id]);
  await saveProgressNow(q, submitted, true);
  try{
    await sbInsert('attempts', {
      student_name: studentName, question_id: q.id,
      submitted_answer: submitted, is_correct: isCorrect
    });
  }catch(e){ /* silent */ }
}

function normalize(s){ return (s||'').toString().trim().toLowerCase().replace(/\s+/g,''); }

// ---------- progress persistence (so answers survive reload / navigating away) ----------
const progressTimers = {};
function saveProgressDebounced(q, submitted, revealed){
  clearTimeout(progressTimers[q.id]);
  progressTimers[q.id] = setTimeout(()=>saveProgressNow(q, submitted, revealed), 500);
}
async function saveProgressNow(q, submitted, revealed){
  const isCorrect = normalize(submitted) === normalize(q.correct_answer);
  try{
    await sbUpsert('progress', {
      student_name: studentName, question_id: q.id, mode: state.currentMode,
      submitted_answer: (submitted===undefined||submitted===null)?null:String(submitted),
      is_correct: isCorrect, revealed: !!revealed, updated_at: new Date().toISOString()
    }, 'student_name,question_id,mode');
  }catch(e){ /* best-effort */ }
}

  const ov = document.createElement('div'); ov.className='overlay';

        <button class="btn btn-ghost" id="pin-cancel">ยกเลิก</button>
        <button class="btn btn-primary" id="pin-ok">ยืนยัน</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const input = document.getElementById('pin-input');
  input.focus();
  const tryOk = ()=>{
    if(input.value === PIN){ document.body.removeChild(ov); onOk(); }

  };
  document.getElementById('pin-ok').onclick = tryOk;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryOk(); });
  document.getElementById('pin-cancel').onclick = ()=>document.body.removeChild(ov);
}

// ---------- scratch pad (smooth, note-app style freehand drawing) ----------
function setupScratchPad(q){
  const canvas = document.getElementById('scratch-canvas');
  const scrollBox = document.getElementById('pad-scroll');
  const ctx = canvas.getContext('2d');
  let strokes = [];
  let drawing = false;
  let tool = 'pen';
  let currentStroke = null;
  let lastPoint = null;   // [x,y] in CSS px, canvas-local (not viewport)
  let saveTimer = null;
  const hint = document.getElementById('save-hint');
  const PEN_COLOR = '#1f2937';
  const ERASER_SIZE = 22;
  const VIEW_HEIGHT = 480;      // visible frame height — tall by default since scratch work runs downward
  const DEFAULT_CANVAS_HEIGHT = VIEW_HEIGHT * 2; // extra headroom below the fold for longer work, reached by manual scroll only
  const EXTEND_CHUNK = VIEW_HEIGHT; // grow the page by one frame-height at a time
  const EXTEND_MARGIN = 60;     // start growing when the pen is this close to the bottom
  const MAX_HEIGHT = VIEW_HEIGHT * 6;  // generous cap so the page can't grow forever
  let canvasHeight = DEFAULT_CANVAS_HEIGHT;

  function fitCanvas(preserveScroll){
    const prevScrollTop = scrollBox.scrollTop;
    const rect = scrollBox.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.style.height = canvasHeight + 'px';
    canvas.width = Math.max(1, rect.width * dpr);
    canvas.height = Math.max(1, canvasHeight * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    redrawAll();
    if(preserveScroll) scrollBox.scrollTop = prevScrollTop;
  }
  function redrawAll(){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    strokes.forEach(s=>drawFullStroke(s));
    if(currentStroke) drawFullStroke(currentStroke);
  }
  function drawFullStroke(s){
    if(!s.points || s.points.length===0) return;
    ctx.globalCompositeOperation = s.tool==='eraser' ? 'destination-out' : 'source-over';
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = s.width;
    if(s.points.length===1){
      ctx.beginPath(); ctx.arc(s.points[0][0], s.points[0][1], s.width/2, 0, Math.PI*2); ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(s.points[0][0], s.points[0][1]);
    for(let i=1;i<s.points.length-1;i++){
      const midX = (s.points[i][0]+s.points[i+1][0])/2;
      const midY = (s.points[i][1]+s.points[i+1][1])/2;
      ctx.quadraticCurveTo(s.points[i][0], s.points[i][1], midX, midY);
    }
    ctx.lineTo(s.points[s.points.length-1][0], s.points[s.points.length-1][1]);
    ctx.stroke();
  }
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    return [e.clientX-rect.left, e.clientY-rect.top];
  }
  function widthFor(e){
    if(tool==='eraser') return ERASER_SIZE;
    if(e.pointerType==='pen' && e.pressure>0) return 1.6 + e.pressure*2.6;
    return 2.6;
  }
  // grows the page and auto-scrolls the visible frame to follow the pen, like OneNote/Miro
  function followPen(p){
    // grows the page quietly if the student writes past the bottom — never moves the scroll position by itself.
    // the student pans with two fingers (or scrolls with a mouse/trackpad) whenever they want to see more.
    let didGrow = false;
    if(p[1] > canvasHeight - EXTEND_MARGIN && canvasHeight < MAX_HEIGHT){
      canvasHeight = Math.min(MAX_HEIGHT, canvasHeight + EXTEND_CHUNK);
      fitCanvas(true);
      didGrow = true;
    }
    return didGrow;
  }
  function scheduleSave(){
    hint.textContent = 'กำลังบันทึก...';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 700);
  }
  async function doSave(){
    try{
      await sbUpsert('scratch_pads', {
        student_name: studentName, question_id: q.id, mode: state.currentMode,
        strokes: strokes, updated_at: new Date().toISOString()
      }, 'student_name,question_id,mode');
      hint.textContent = 'บันทึกแล้ว ✓';
    }catch(e){ hint.textContent = 'บันทึกไม่สำเร็จ'; }
  }

  let panning = false;
  let panStartY = 0;
  let panStartScrollTop = 0;

  function avgTouchListY(touchList){
    let sum=0, n=Math.min(2, touchList.length);
    for(let i=0;i<n;i++) sum += touchList[i].clientY;
    return n ? sum/n : 0;
  }
  function cancelInProgressStroke(){
    drawing = false;
    currentStroke = null;
    lastPoint = null;
    redrawAll(); // wipes the tentative dot/line that hadn't been committed to strokes[] yet
  }

  function startStroke(pt){
    drawing = true;
    const p = pos(pt);
    const w = widthFor(pt);
    currentStroke = { tool, color: tool==='eraser' ? '#000000' : PEN_COLOR, width: w, points:[p] };
    lastPoint = p;
    followPen(p);
    // draw an immediate dot so a simple tap (or the start of a short stroke like "+") is always visible
    ctx.globalCompositeOperation = tool==='eraser' ? 'destination-out' : 'source-over';
    ctx.fillStyle = currentStroke.color;
    ctx.beginPath(); ctx.arc(p[0], p[1], w/2, 0, Math.PI*2); ctx.fill();
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle = currentStroke.color; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
  }
  function moveStroke(pt){
    if(!drawing) return;
    const p = pos(pt);
    const grew = followPen(p); // may resize the canvas (clears pixels) — repaint the in-progress stroke if so
    if(grew){
      ctx.globalCompositeOperation = tool==='eraser' ? 'destination-out' : 'source-over';
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.strokeStyle = currentStroke.color; ctx.lineWidth = currentStroke.width;
      ctx.beginPath(); ctx.moveTo(lastPoint[0], lastPoint[1]);
    }
    const midX = (lastPoint[0]+p[0])/2, midY = (lastPoint[1]+p[1])/2;
    ctx.quadraticCurveTo(lastPoint[0], lastPoint[1], midX, midY);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(midX, midY);
    currentStroke.points.push(p);
    lastPoint = p;
  }
  function endStroke(){
    if(!drawing) return;
    drawing = false;
    if(currentStroke && currentStroke.points.length>0){ strokes.push(currentStroke); scheduleSave(); }
    currentStroke = null; lastPoint = null;
  }

  // Pen or mouse always writes (Apple Pencil reports as pointerType 'pen' via Pointer Events on iOS).
  canvas.addEventListener('pointerdown', e=>{
    if(e.pointerType==='touch') return;
    e.preventDefault();
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    startStroke(e);
  });
  canvas.addEventListener('pointermove', e=>{
    if(e.pointerType==='touch') return;
    e.preventDefault();
    moveStroke(e);
  });
  canvas.addEventListener('pointerup', e=>{ if(e.pointerType!=='touch') endStroke(); });
  canvas.addEventListener('pointerleave', e=>{ if(e.pointerType!=='touch') endStroke(); });
  canvas.addEventListener('pointercancel', e=>{ if(e.pointerType!=='touch') endStroke(); });

  // Finger touches: native Touch Events give reliable simultaneous-touch counts on iOS/Safari,
  // unlike multi-touch Pointer Events which are flaky there. One finger writes, two fingers pan.
  canvas.addEventListener('touchstart', e=>{
    e.preventDefault();
    if(e.touches.length === 1){
      startStroke(e.touches[0]);
    } else if(e.touches.length >= 2){
      if(drawing) cancelInProgressStroke(); // the first finger's tentative mark gets discarded
      panning = true;
      panStartY = avgTouchListY(e.touches);
      panStartScrollTop = scrollBox.scrollTop;
    }
  }, {passive:false});
  canvas.addEventListener('touchmove', e=>{
    e.preventDefault();
    if(panning && e.touches.length >= 2){
      const maxScroll = Math.max(0, canvasHeight - scrollBox.clientHeight);
      scrollBox.scrollTop = Math.min(maxScroll, Math.max(0, panStartScrollTop - (avgTouchListY(e.touches) - panStartY)));
      return;
    }
    if(e.touches.length === 1 && drawing) moveStroke(e.touches[0]);
  }, {passive:false});
  function onTouchEnd(e){
    e.preventDefault();
    if(e.touches.length < 2) panning = false;
    if(e.touches.length === 0) endStroke();
  }
  canvas.addEventListener('touchend', onTouchEnd, {passive:false});
  canvas.addEventListener('touchcancel', onTouchEnd, {passive:false});
  canvas.addEventListener('contextmenu', e=>e.preventDefault());

  document.getElementById('tool-pen').onclick = ()=>{ tool='pen'; document.getElementById('tool-pen').classList.add('active'); document.getElementById('tool-eraser').classList.remove('active'); };
  document.getElementById('tool-eraser').onclick = ()=>{ tool='eraser'; document.getElementById('tool-eraser').classList.add('active'); document.getElementById('tool-pen').classList.remove('active'); };
  document.getElementById('tool-undo').onclick = ()=>{ strokes.pop(); redrawAll(); scheduleSave(); };
  document.getElementById('tool-clear').onclick = ()=>{
    if(strokes.length && !confirm('ล้างกระดาษทดข้อนี้ทั้งหมด?')) return;
    strokes=[]; canvasHeight = DEFAULT_CANVAS_HEIGHT; fitCanvas(); scrollBox.scrollTop = 0; scheduleSave();
  };

  window.addEventListener('resize', ()=>fitCanvas(true));

  currentPad = {
    flushSave(){ clearTimeout(saveTimer); if(strokes.length) doSave(); }
  };

  // load existing strokes, growing the page tall enough to show everything the student already wrote
  hint.textContent = 'กำลังโหลดกระดาษทด...';
  fitCanvas();
  sbGet(`scratch_pads?student_name=eq.${encodeURIComponent(studentName)}&question_id=eq.${q.id}&mode=eq.${state.currentMode}&select=strokes`)
    .then(rows=>{
      if(rows && rows[0] && rows[0].strokes && rows[0].strokes.length){
        strokes = rows[0].strokes;
        let maxY = DEFAULT_CANVAS_HEIGHT;
        strokes.forEach(s=> (s.points||[]).forEach(p=>{ if(p[1] > maxY) maxY = p[1]; }));
        canvasHeight = Math.min(MAX_HEIGHT, Math.ceil((maxY + 40) / EXTEND_CHUNK) * EXTEND_CHUNK);
        fitCanvas();
        hint.textContent='โหลดกระดาษทดเดิมแล้ว';
      }
      else hint.textContent = 'พร้อมจด';
    })
    .catch(()=>{ hint.textContent = 'พร้อมจด (ออฟไลน์)'; });
}

// ---------- exam submit / result ----------
async function runExerciseSummary(){
  state.screen = 'loading'; render();
  try{
    const qs = await sbGet(`questions?topic_id=eq.${state.currentTopic.id}&mode=eq.exercise&select=*&order=order_no`);
    if(qs.length === 0){
      alert('ยังไม่มีแบบฝึกหัดในหมวดนี้');
      state.screen='modepick'; render(); return;
    }
    const qids = qs.map(q=>q.id);
    const rows = await sbGet(`progress?student_name=eq.${encodeURIComponent(studentName)}&question_id=in.(${qids.join(',')})&mode=eq.exercise&select=question_id,submitted_answer`);
    const answerMap = {};
    rows.forEach(r=>{ if(r.submitted_answer!==null && r.submitted_answer!==undefined && r.submitted_answer!=='') answerMap[r.question_id] = r.submitted_answer; });
    let correct = 0;
    qs.forEach(q=>{
      const submitted = (answerMap[q.id]||'').toString().trim();
      if(normalize(submitted) === normalize(q.correct_answer)) correct++;
    });
    state.currentMode = 'exercise';
    state.questions = qs;
    state.answers = answerMap;
    state.revealed = {};
    state.revealOpen = {};
    state.examSubmitted = true;
    state.examScore = { correct, total: qs.length };
    state.screen = 'examresult';
  }catch(e){
    alert('ตรวจคำตอบไม่สำเร็จ: ' + e.message);
    state.screen = 'modepick';
  }
  render();
}

async function submitExam(){
  let correct = 0;
  const answersLog = {};
  await Promise.all(state.questions.map(async q=>{
    const submitted = (state.answers[q.id]||'').toString().trim();
    const ok = normalize(submitted) === normalize(q.correct_answer);
    if(ok) correct++;
    answersLog[q.id] = { submitted, correct: ok };
    clearTimeout(progressTimers[q.id]);
    await saveProgressNow(q, submitted, false); // not revealed yet — reviewed individually afterwards
  }));
  state.examSubmitted = true;
  state.examScore = { correct, total: state.questions.length };
  try{
    await sbInsert('exam_results', {
      student_name: studentName, topic_id: state.currentTopic.id,
      score: correct, total: state.questions.length, answers: answersLog
    });
  }catch(e){}
  state.screen = 'examresult';
  render();
}

function renderExamResult(){
  const back = document.createElement('div');
  back.className='link-back'; back.textContent='← กลับไปเลือกโหมด';
  back.onclick = goToModePick;
  app.appendChild(back);

  const hero = document.createElement('div'); hero.className='score-hero';
  const pct = Math.round(state.examScore.correct/state.examScore.total*100);
  const wrongCount = state.examScore.total - state.examScore.correct;
  const modeLabel = state.currentMode === 'exercise' ? 'สรุปผลแบบฝึกหัด' : 'ผลสอบ';
  hero.innerHTML = `<div class="big">${state.examScore.correct}/${state.examScore.total}</div>
    <div class="sub">${modeLabel} — ${state.currentTopic.name_th}</div>
    <div class="sub" style="margin-top:6px;font-weight:700">✅ ผ่าน ${state.examScore.correct} ข้อ &nbsp;•&nbsp; ❌ ไม่ผ่าน ${wrongCount} ข้อ &nbsp;•&nbsp; ${pct}%</div>`;
  app.appendChild(hero);

  state.questions.forEach((q,i)=>{
    const submitted = (state.answers[q.id]||'').toString().trim();
    const ok = normalize(submitted) === normalize(q.correct_answer);
    const item = document.createElement('div'); item.className='exam-list-item';
    item.innerHTML = `
      <div class="q-num">ข้อ ${i+1} ${ok?'✓ ถูก':'✗ ผิด'}</div>
      <div class="q-text" style="margin-top:6px">${formatMath(q.question_text)}</div>
      ${q.question_svg ? `<div class="q-svg">${q.question_svg}</div>` : ''}
      <div style="margin-top:6px;font-size:13.5px;color:var(--ink-soft)">คำตอบของน้อง: ${submitted?formatMath(submitted):'(ไม่ได้ตอบ)'}</div>
      <div id="rev-${q.id}" style="margin-top:8px"></div>
    `;
    app.appendChild(item);
    if(state.revealed[q.id]){
      if(state.revealOpen[q.id] !== false) paintExamReveal(q, ok);
      else paintExamRevealClosed(q);
    } else {
      const btn = document.createElement('button');
      btn.className='btn btn-primary'; btn.textContent='ดูเฉลย (ใส่รหัส)';
      btn.onclick = ()=>askPinThen(async ()=>{
        state.revealed[q.id]=true;
        paintExamReveal(q, ok);
        await saveProgressNow(q, submitted, true);
      });
      document.getElementById(`rev-${q.id}`).appendChild(btn);
    }
  });
}
function paintExamReveal(q, ok){
  const el = document.getElementById(`rev-${q.id}`);
  state.revealOpen[q.id] = true;
  el.innerHTML = `<div class="reveal-panel ${ok?'correct':'incorrect'}">
    <div class="reveal-top">
      <div class="verdict">เฉลย: ${formatMath(q.correct_answer)}</div>
      <button class="reveal-close" id="reveal-close-${q.id}" title="ปิดเฉลย">✕ ปิด</button>
    </div>
    <div class="explain-text">${formatMath(q.explanation)}</div>
    ${q.explanation_svg ? `<div class="q-svg">${q.explanation_svg}</div>` : ''}
  </div>`;
  document.getElementById(`reveal-close-${q.id}`).onclick = ()=>{ state.revealOpen[q.id] = false; paintExamRevealClosed(q); };
}
function paintExamRevealClosed(q){
  const el = document.getElementById(`rev-${q.id}`);
  const submitted = (state.answers[q.id]||'').toString().trim();
  const ok = normalize(submitted) === normalize(q.correct_answer);
  el.innerHTML = `<button class="btn btn-ghost reveal-reopen-btn">👁️ แสดงเฉลยอีกครั้ง</button>`;
  el.querySelector('.reveal-reopen-btn').onclick = ()=>{ state.revealOpen[q.id] = true; paintExamReveal(q, ok); };
}

// ---------- parent / teacher dashboard ----------
async function openParentDashboard(){
  state.screen = 'loading'; render();
  try{
    const [progRows, examRows, allQuestions] = await Promise.all([
      sbGet(`progress?select=student_name`),
      sbGet(`exam_results?select=student_name`),
      sbGet(`questions?select=id,topic_id,mode`),
    ]);
    const nameSet = new Set();
    progRows.forEach(r=>nameSet.add(r.student_name));
    examRows.forEach(r=>nameSet.add(r.student_name));
    if(studentName) nameSet.add(studentName);
    const students = Array.from(nameSet).sort();
    if(!state.parentStudent || !students.includes(state.parentStudent)) state.parentStudent = students[0] || studentName;

    const qMap = {}; allQuestions.forEach(q=>{ qMap[q.id]=q; });

    let byTopic = {};
    state.topics.forEach(t=> byTopic[t.id] = {
      exercise:{done:0,total:0,correct:0}, exam:{done:0,total:0,correct:0}
    });
    allQuestions.forEach(q=>{ if(byTopic[q.topic_id]) byTopic[q.topic_id][q.mode].total++; });

    let examHistory = [];
    let activityLog = [];
    if(state.parentStudent){
      const [myProgress, myExams] = await Promise.all([
        sbGet(`progress?student_name=eq.${encodeURIComponent(state.parentStudent)}&select=question_id,submitted_answer,is_correct,revealed,mode,updated_at`),
        sbGet(`exam_results?student_name=eq.${encodeURIComponent(state.parentStudent)}&select=topic_id,score,total,created_at&order=created_at.desc&limit=20`),
      ]);
      myProgress.forEach(p=>{
        const q = qMap[p.question_id]; if(!q || !byTopic[q.topic_id]) return;
        if(p.submitted_answer!==null && p.submitted_answer!==undefined && p.submitted_answer!==''){
          byTopic[q.topic_id][q.mode].done++;
          if(p.is_correct) byTopic[q.topic_id][q.mode].correct++;
        }
      });
      const topicMap = {}; state.topics.forEach(t=>{ topicMap[t.id]=t; });
      const subjectMap = {}; state.subjects.forEach(s=>{ subjectMap[s.id]=s; });
      activityLog = myProgress
        .filter(p=> p.submitted_answer!==null && p.submitted_answer!==undefined && p.submitted_answer!=='' && p.updated_at)
        .map(p=>{
          const q = qMap[p.question_id];
          const t = q ? topicMap[q.topic_id] : null;
          const s = t ? subjectMap[t.subject_id] : null;
          return {
            topic_name: t ? t.name_th : 'ไม่ทราบหัวข้อ',
            subject_name: s ? s.name_th : '',
            mode: p.mode, is_correct: p.is_correct, updated_at: p.updated_at,
          };
        })
        .sort((a,b)=> new Date(b.updated_at) - new Date(a.updated_at))
        .slice(0, 50);
      examHistory = myExams;
    }
    state.parentData = { students, byTopic, examHistory, activityLog };
  }catch(e){
    state.parentData = { students:[studentName].filter(Boolean), byTopic:{}, examHistory:[], activityLog:[], error:e.message };
  }
  state.screen = 'parent';
  render();
}

    topicsOf.forEach(t=>{
      const st = data.byTopic[t.id] || {exercise:{done:0,total:0,correct:0},exam:{done:0,total:0,correct:0}};
      const row = document.createElement('div');
      row.style.cssText = 'padding:10px 0;border-top:1px solid var(--paper-line);';
      const exAcc = st.exercise.done>0 ? Math.round(st.exercise.correct/st.exercise.done*100) : null;
      const xmAcc = st.exam.done>0 ? Math.round(st.exam.correct/st.exam.done*100) : null;
      row.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <div style="font-weight:600;font-size:14px">${escapeHtml(t.name_th)}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <span class="pill ${st.exercise.done>=st.exercise.total && st.exercise.total>0?'done':''}">✏️ ${st.exercise.done}/${st.exercise.total}${exAcc!==null?` · ถูก ${exAcc}%`:''}</span>
            <span class="pill ${st.exam.done>=st.exam.total && st.exam.total>0?'done':''}">📝 ${st.exam.done}/${st.exam.total}${xmAcc!==null?` · ถูก ${xmAcc}%`:''}</span>
            <button class="tool-btn" data-topic="${t.id}" data-name="${escapeHtml(t.name_th)}" title="ล้างค่าหัวข้อนี้" style="width:auto;padding:0 10px;font-size:12px;color:var(--bad)">ล้าง</button>
          </div>
        </div>`;
      card.appendChild(row);
    });
    app.appendChild(card);
    card.querySelectorAll('button[data-topic]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm(`ล้างคำตอบ คะแนน และกระดาษทดทั้งหมดของ "${btn.dataset.name}" สำหรับ ${state.parentStudent}?\nการลบนี้ย้อนกลับไม่ได้`)) return;
        const prevStudent = studentName; studentName = state.parentStudent; // reuse deletion helper scoped to this student
        try{ await resetTopicProgress({id: btn.dataset.topic, name_th: btn.dataset.name}); }
        finally{ studentName = prevStudent; }
        openParentDashboard();
      };
    });
  });

  // exam history
  if(data.examHistory && data.examHistory.length){
    const histCard = document.createElement('div'); histCard.className='card';
    histCard.innerHTML = `<div class="holes"><span></span><span></span><span></span><span></span></div><h3 style="margin-bottom:10px">ประวัติการทำข้อสอบล่าสุด</h3>`;
    data.examHistory.forEach(r=>{
      const topic = state.topics.find(t=>t.id===r.topic_id);
      const d = new Date(r.created_at);
      const dateStr = d.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'});
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--paper-line);font-size:13.5px;';
      row.innerHTML = `<span>${escapeHtml(topic ? topic.name_th : r.topic_id)}</span><span style="color:var(--ink-soft)">${dateStr} · ${r.score}/${r.total}</span>`;
      histCard.appendChild(row);
    });
    app.appendChild(histCard);
  }

  // per-question activity log — exactly which question, which day, what time
  if(data.activityLog && data.activityLog.length){
    const actCard = document.createElement('div'); actCard.className='card';
    actCard.innerHTML = `<div class="holes"><span></span><span></span><span></span><span></span></div>
      <h3 style="margin-bottom:4px">🕒 กิจกรรมล่าสุด</h3>
      <div class="subtitle" style="color:var(--ink-soft);margin:0 0 10px">ทำข้อไหน วันไหน เวลาไหน — ${escapeHtml(state.parentStudent)}</div>`;
    let lastDateLabel = null;
    data.activityLog.forEach(a=>{
      const d = new Date(a.updated_at);
      const dateLabel = d.toLocaleDateString('th-TH', {weekday:'short', day:'numeric', month:'short', year:'2-digit'});
      const timeLabel = d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
      if(dateLabel !== lastDateLabel){
        const dateHead = document.createElement('div');
        dateHead.style.cssText = 'font-family:\'Kanit\';font-weight:700;font-size:12.5px;color:var(--marigold-dark);margin-top:14px;margin-bottom:4px;';
        dateHead.textContent = dateLabel;
        actCard.appendChild(dateHead);
        lastDateLabel = dateLabel;
      }
      const modeLabel = a.mode === 'exam' ? '📝 ข้อสอบ' : '✏️ ฝึกหัด';
      const resultIcon = a.is_correct ? '✅' : '❌';
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--paper-line);font-size:13px;gap:8px;';
      row.innerHTML = `
        <span>${resultIcon} ${modeLabel} — ${escapeHtml(a.subject_name)}${a.subject_name?' · ':''}${escapeHtml(a.topic_name)}</span>
        <span style="color:var(--ink-soft);white-space:nowrap">${timeLabel} น.</span>`;
      actCard.appendChild(row);
    });
    app.appendChild(actCard);
  }
}

// ---------- parent / teacher dashboard end ----------
function escapeHtml(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// renders "2^3" as 2 with a superscript 3, and "3/4" as a stacked fraction — for math question/answer text
function formatMath(raw){
  let s = escapeHtml(raw);
  s = s.replace(/([0-9\)])\^([0-9]+)/g, (m,a,b)=> a + '<sup>' + b + '</sup>');
  s = s.replace(/\b([0-9]+)\/([0-9]+)\b/g, (m,a,b)=> `<span class="frac"><span class="num">${a}</span><span class="den">${b}</span></span>`);
  return s;
}

async function goToModePick(){
  const topic = state.currentTopic;
  state.screen = 'loading'; render();
  try{ state.topicStats = Object.assign({}, state.topicStats, await fetchTopicStats([topic])); }catch(e){}
  state.currentTopic = topic;
  state.screen = 'modepick';
  render();
}

init();
</script>
