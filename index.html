<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f3d2a">
<title>ห้องเตรียมสอบ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap');

:root{
  --bg:#f2f5f1; --surface:#fff; --ink:#1b2a22; --ink2:#5a6a60; --line:#dfe6df;
  --brand:#0f3d2a; --brand2:#17724a; --brand-soft:#e5f3ea;
  --accent:#f2a71b; --accent-d:#c9860c; --accent-soft:#fff3d6;
  --good:#1f8f55; --good-soft:#e3f5ea; --bad:#c62828; --bad-soft:#fdeaea; --warn:#a85f00; --warn-soft:#fff1d6;
  --fh:'Kanit','Thonburi','Noto Sans Thai',sans-serif; --radius:14px; --shadow:0 1px 2px rgba(15,61,42,.06),0 6px 18px rgba(15,61,42,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Sarabun','Thonburi','Noto Sans Thai',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;font-size:16px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--fh);margin:0;line-height:1.3}
a{color:inherit;text-decoration:none}
button,input,select{font-family:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
main{padding:18px 0 90px;min-height:70vh}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* top bar */
.topbar{background:var(--brand);color:#fff;position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;min-height:62px;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--brand);display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700;font-size:16px;flex-shrink:0;transform:rotate(-4deg)}
.brand b{font-family:var(--fh);font-size:18px;display:block;font-weight:600}
.brand small{display:block;font-size:12px;opacity:.72;margin-top:-2px}
.top-right{display:flex;align-items:center;gap:8px}
.tbtn{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:active{background:rgba(255,255,255,.22)}
.tbtn.on{background:var(--accent);color:#2a1d00;border-color:var(--accent)}
.sync{font-size:12px;opacity:.8;white-space:nowrap}
.checker-bar{background:var(--accent-soft);color:#5b3d00;border-bottom:1px solid #f0d99a;font-size:13.5px}
.checker-bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:7px;padding-bottom:7px}
@media(max-width:700px){.brand small,.tbtn .lbl{display:none}.brand b{font-size:16px}}

/* generic */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card h3{font-size:18px}
.btn{min-height:46px;padding:0 20px;border:none;border-radius:11px;font-weight:700;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{background:var(--brand);color:#fff}
.btn-accent{background:var(--accent);color:#2a1d00}
.btn-soft{background:var(--brand-soft);color:var(--brand)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:9px}
input[type=text],input[type=password],select{font-size:16px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
label.lb{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.note{font-size:13.5px;background:var(--accent-soft);border:1px solid #f0d99a;border-radius:10px;padding:10px 12px;color:#5b3d00}
.err{color:var(--bad);font-size:13.5px;min-height:18px;margin-top:6px}
.crumbs{font-size:14px;color:var(--ink2);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a{color:var(--brand2);font-weight:600;padding:6px 0}
h2.page{font-size:24px;margin-bottom:4px}
.empty{text-align:center;color:var(--ink2);padding:40px 10px}
.loading{text-align:center;color:var(--ink2);padding:60px 10px}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand2);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* progress */
.bar{height:8px;background:#e8eee8;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand2);border-radius:99px;transition:width .3s}
.bar.accent>i{background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:#eef2ee;color:var(--ink2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.brand{background:var(--brand-soft);color:var(--brand)}
.ring-bg{fill:none;stroke:#e6ece6} .ring-fg{fill:none;stroke:var(--brand2);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring text{font-family:var(--fh);font-weight:700;fill:var(--brand)}

/* level tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;min-height:56px;padding:8px 16px;border-radius:13px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px}
.tab small{display:block;font-weight:600;font-size:12px;color:var(--ink2)}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tab.on small{color:#cfe8d9}
.tab .ic{font-size:22px}

/* home */
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:linear-gradient(135deg,#fff 0%,#f1f8f3 100%)}
.hero h2{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.subj{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;cursor:pointer;border:2px solid transparent;display:block}
.subj:active,.subj:hover{border-color:var(--accent)}
.subj .top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.subj .ico{width:46px;height:46px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.subj h3{font-size:18px}
.subj .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}

/* topics */
.topic{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.t-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.num{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;font-family:var(--fh);font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.t-name{font-weight:700;font-size:17px}
.t-prog{width:150px;flex-shrink:0;text-align:right}
.t-prog .bar{margin-top:4px}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.setbox{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfcfb}
.setbtn{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer;border-radius:9px}
.setbtn .ic{font-size:24px}
.setbtn .lbl{font-weight:700;font-size:15.5px;line-height:1.2}
.setbtn .sub{font-size:13px;color:var(--ink2);line-height:1.45;display:inline-block;margin-top:2px}
.setbtn .go{margin-left:auto;font-weight:700;font-size:13px;padding:6px 12px;border-radius:99px;background:var(--brand);color:#fff;white-space:nowrap}
.setbtn.s-progress .go{background:var(--accent);color:#2a1d00}
.setbtn.s-complete .go,.setbtn.s-submitted .go{background:var(--good-soft);color:var(--good)}
.setbox .bar{margin-top:8px;height:8px}
.bar.seg3{display:flex}.bar.seg3>i{border-radius:0}.bar.seg3 .g{background:var(--good)}.bar.seg3 .r{background:var(--bad)}
.setbox .tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.search{margin-bottom:12px}
@media(max-width:620px){.t-head{flex-wrap:wrap}.t-prog{width:100%;text-align:left}}

/* player */
.player-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.player-head h2{font-size:21px}
.navchips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.nc{flex:0 0 auto;width:42px;height:42px;border-radius:11px;border:2px solid var(--line);background:#fff;font-family:var(--fh);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.nc.done{background:var(--brand-soft);border-color:#b8dcc7;color:var(--brand)}
.nc.ok{background:var(--good);border-color:var(--good);color:#fff}
.nc.no{background:var(--bad);border-color:var(--bad);color:#fff}
.nc.cur{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,167,27,.35);color:var(--ink)}
.player-grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media(min-width:1000px){.player-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.padcol{position:sticky;top:78px}.pad-scroll{height:calc(100vh - 310px)!important;min-height:420px}}
.q-text{font-size:18px;line-height:1.7;font-weight:500;white-space:pre-line}
.q-svg{margin:14px 0;text-align:center}
.q-svg svg,.q-svg img{max-width:100%;height:auto;background:#fbfaf3;border-radius:10px;padding:8px}
.qhint{display:inline-block;margin-bottom:8px}
.choice{display:flex;align-items:center;gap:12px;padding:13px 14px;border:2px solid var(--line);border-radius:12px;margin-top:10px;cursor:pointer;min-height:54px;font-size:17px;background:#fff}
.choice .mk{width:24px;height:24px;border-radius:50%;border:2px solid #b9c5bc;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.choice.multi .mk{border-radius:7px}
.choice.sel{border-color:var(--brand2);background:var(--brand-soft)}
.choice.sel .mk{background:var(--brand2);border-color:var(--brand2)}
.choice.lock{cursor:default}
.fill{font-size:20px!important;padding:14px 16px!important}
.reveal{margin-top:14px;padding:16px;border-radius:12px;line-height:1.7}
.reveal.good{background:var(--good-soft);border:1.5px solid var(--good)}
.reveal.bad{background:var(--bad-soft);border:1.5px solid var(--bad)}
.reveal.plain{background:#f4f6f4;border:1.5px solid var(--line)}
.reveal .verdict{font-family:var(--fh);font-weight:600;font-size:17px}
.reveal.good .verdict{color:var(--good)} .reveal.bad .verdict{color:var(--bad)}
.reveal .exp{white-space:pre-line;margin-top:8px}
.reveal .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(0,0,0,.15)}
.navbar{position:sticky;bottom:0;z-index:20;background:rgba(242,245,241,.95);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:14px;border-top:1px solid var(--line)}
.navbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.navbar .btn{min-width:130px}
.navbar .wrap{padding:0}

/* scratch pad */
.padcard{padding:14px}
.pad-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.pad-head b{font-family:var(--fh);font-weight:600}
.pad-tools{display:flex;gap:6px}
.tool{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tool.on{background:var(--accent);border-color:var(--accent-d)}
.pad-scroll{height:480px;overflow-y:auto;overflow-x:hidden;border-radius:10px;border:1px solid var(--line);background:#fffefa;-webkit-overflow-scrolling:touch;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,#eef1e6 31px 32px)}
canvas.pad{width:100%;display:block;touch-action:none}
.padcard,.padcard *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pad-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:6px;gap:8px}

/* results / lists */
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.score .big{font-family:var(--fh);font-size:40px;font-weight:700;color:var(--brand);line-height:1}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.seg button{min-height:42px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.item{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:12px;border-left:6px solid var(--line)}
.item.ok{border-left-color:var(--good)} .item.no{border-left-color:var(--bad)} .item.skip{border-left-color:var(--accent)}
.item .qno{font-family:var(--fh);font-weight:600;font-size:14px;color:var(--ink2)}
.yours{margin-top:10px;font-size:15px;background:#f6f8f6;border-radius:9px;padding:9px 12px}
.pv canvas{width:100%;background:#fffefa;border:1px solid var(--line);border-radius:10px;margin-top:8px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.kpi .v{font-family:var(--fh);font-size:28px;font-weight:700;color:var(--brand);line-height:1.1}
.kpi .l{font-size:13px;color:var(--ink2);margin-top:4px}
.drow{padding:12px 0;border-top:1px solid var(--line)}
.drow:first-of-type{border-top:none}
.dsets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px}
.dset{background:#f6f8f6;border-radius:10px;padding:9px 11px}
.list-line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}

/* overlays */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,25,18,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.dialog{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{margin:0 0 14px;color:var(--ink2);font-size:14.5px}
.dialog input{text-align:center;letter-spacing:8px;font-size:22px}
.dialog .row{justify-content:center;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2d25;color:#fff;padding:11px 18px;border-radius:99px;font-size:14.5px;z-index:120;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:42px;padding:0 15px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:15px;cursor:pointer}
.chip:active{background:var(--accent-soft)}
sup{font-size:.66em;font-weight:700;line-height:0}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:-0.45em;margin:0 3px;line-height:1.1;font-size:.92em}
.frac .n{padding:0 4px 1px;border-bottom:1.6px solid currentColor}
.frac .d{padding:1px 4px 0}
@media print{.topbar,.checker-bar,.navbar,.no-print,#toast{display:none!important}body{background:#fff}.card,.kpi{box-shadow:none;border:1px solid #ccc}}
</style>
</head>
<body>
<div id="top"></div>
<main><div class="wrap" id="app"></div></main>
<div id="overlay-root"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* =====================================================================
   CONFIG — แก้ได้ตรงนี้
   ===================================================================== */
var SUPABASE_DEFAULT = {
  url: "https://mbwkslgkiiqpfeqslqcu.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1id2tzbGdraWlxcGZlcXNscWN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDMwNDEsImV4cCI6MjEwMjE3OTA0MX0.WVreyl-NVB3_uHxS4yVeDyey17YWdN99eBjcpv9YmGk"
};

/* ระดับชั้น: ตัวเลขคือค่า phase ในตาราง subjects/topics
   - always:true  = แสดงแท็บเสมอ แม้ยังไม่มีเนื้อหา
   - ระดับที่ไม่ได้ always จะโผล่เองเมื่อมี subjects ที่ phase ตรงกัน
   - เพิ่มชั้นใหม่: เพิ่มบรรทัดที่นี่ + ใส่ข้อมูลใน Supabase ด้วย phase เป็นเลขนั้น
   - ถ้าลืมใส่ที่นี่ แอปจะแสดงเป็น "ระดับ N" ให้อัตโนมัติ */
var LEVELS = {
  1:{name:'เตรียมสอบเข้า ม.1',   short:'เตรียมสอบ ม.1', icon:'🎓', always:true},
  2:{name:'ป.6 ปีการศึกษา 2569', short:'ป.6 · 2569',    icon:'📚', always:true},
  3:{name:'ม.1', short:'ม.1', icon:'🏫'},
  4:{name:'ม.2', short:'ม.2', icon:'🏫'},
  5:{name:'ม.3', short:'ม.3', icon:'🏫'}
};

/* ชนิดชุดข้อสอบ (ค่า mode ในตาราง questions)
   instant:true = ทำทีละข้อแล้วขอเฉลยได้ / false = ทำครบแล้ว "ส่งตรวจ"
   mode ใหม่ ๆ ที่ไม่ได้ลงทะเบียนไว้ จะถูกปฏิบัติเหมือนข้อสอบ (ส่งตรวจ) และใช้ชื่อ mode เป็นป้าย */
var MODES = {
  exercise:{label:'แบบฝึกหัด',   icon:'✏️', instant:true,  order:1},
  exam:    {label:'ข้อสอบจำลอง', icon:'📝', instant:false, order:2}
};
var SHOW_CORRECT_TO_STUDENT = false;  // true = ให้น้องเห็นจำนวนข้อถูก/ผิดในหน้ารายการด้วย (ปกติเห็นเฉพาะโหมดผู้ตรวจ)
var CHECKER_IDLE_MS = 10*60*1000;   // ล็อกโหมดผู้ตรวจอัตโนมัติเมื่อไม่ได้ใช้งาน

/* =====================================================================
   helpers
   ===================================================================== */
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function h(s){ return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function enc(s){ return encodeURIComponent(String(s)); }
function modeMeta(m){ return MODES[m] || {label:m, icon:'📄', instant:false, order:9}; }
function levelInfo(n){ return LEVELS[n] || {name:'ระดับ '+n, short:'ระดับ '+n, icon:'📘'}; }
function chunks(a,n){ var o=[]; for(var i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; }
function pct(a,b){ return b>0 ? Math.round(a/b*100) : 0; }
function subjectIcon(n){

  if(/คณิต|เลข/.test(n)) return '➗'; if(/วิทย์|วิทยาศาสตร์/.test(n)) return '🔬';

function fmtDate(d,opt){ try{ return new Date(d).toLocaleDateString('th-TH',opt||{day:'numeric',month:'short',year:'2-digit'}); }catch(e){ return ''; } }

// ตัวเลขยกกำลัง x^2 และเศษส่วนซ้อน 3/4 (ไม่แตะวันที่ เช่น 1/2/2569)
function formatMath(raw){
  var s = h(raw);
  s = s.replace(/([0-9A-Za-z\)])\^(-?[0-9]+)/g,function(m,a,b){ return a+'<sup>'+b+'</sup>'; });
  s = s.replace(/([0-9]+)\/([0-9]+)/g,function(m,a,b,off,str){
    var prev = str.charAt(off-1), next = str.charAt(off+m.length);
    if(prev==='/' || next==='/') return m;
    return '<span class="frac"><span class="n">'+a+'</span><span class="d">'+b+'</span></span>';
  });
  return s;
}

        return window.storage.get(k).then(function(r){ if(r && r.value!=null) return JSON.parse(r.value); return undefined; }).catch(function(){});

      try{ var x=localStorage.getItem('m1:'+k); return x?JSON.parse(x):null; }catch(e){ return null; }
    });
  },

  }
};

/* =====================================================================
   network (Supabase REST) — มี timeout, แบ่งหน้าเกิน 1,000 แถว
   ===================================================================== */
function sbReq(path,method,body,prefer){
  var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); },25000);
  var headers = {'apikey':S.cfg.key,'Authorization':'Bearer '+S.cfg.key,'Content-Type':'application/json'};
  if(prefer) headers['Prefer']=prefer;
  return fetch(S.cfg.url+'/rest/v1/'+path,{method:method,headers:headers,body:body?JSON.stringify(body):undefined,signal:ctrl?ctrl.signal:undefined})
    .then(function(res){
      if(!res.ok){ return res.text().then(function(t){ var e=new Error('HTTP '+res.status+(t?' — '+t.slice(0,160):'')); e.status=res.status; throw e; }); }
      return method==='GET' ? res.json() : null;
    })
    .catch(function(e){ if(e && e.name==='AbortError') throw new Error('เชื่อมต่อช้าเกินไป ลองใหม่อีกครั้ง'); throw e; })
    .then(function(v){ clearTimeout(timer); return v; }, function(e){ clearTimeout(timer); throw e; });
}
function sbGet(p){ return sbReq(p,'GET'); }
function sbUpsert(t,b,c){ return sbReq(t+'?on_conflict='+c,'POST',b,'resolution=merge-duplicates,return=minimal'); }
function sbInsert(t,b){ return sbReq(t,'POST',b,'return=minimal'); }
function sbDelete(p){ return sbReq(p,'DELETE',null,'return=minimal'); }
// Supabase ตอบสูงสุด 1,000 แถวต่อครั้ง — ดึงต่อทีละหน้าจนครบ
function sbGetAll(path){
  var out=[], PAGE=1000;
  function next(off){
    return sbGet(path+(path.indexOf('?')>=0?'&':'?')+'limit='+PAGE+'&offset='+off).then(function(rows){
      for(var i=0;i<rows.length;i++) out.push(rows[i]);
      if(rows.length<PAGE || off>=60000) return out;
      return next(off+PAGE);
    });
  }
  return next(0);
}

function askPin(reason){
  return new Promise(function(resolve){
    var ov=openDialog('<h3>🔒 โหมดผู้ตรวจ</h3><p>'+h(reason||'ให้ผู้ปกครอง/ครูใส่รหัส')+'</p><input type="password" inputmode="numeric" maxlength="6" id="pin-in" placeholder="••••" autocomplete="off"><div class="err" id="pin-err"></div><div class="row"><button class="btn btn-ghost" id="pin-cancel">ยกเลิก</button><button class="btn btn-primary" id="pin-ok">ยืนยัน</button></div>');
    var inp=$('#pin-in',ov); setTimeout(function(){ inp.focus(); },50);
    function ok(){
      var now=Date.now();
      if(now<S.pinLockUntil){ $('#pin-err',ov).textContent='ลองผิดหลายครั้ง รออีก '+Math.ceil((S.pinLockUntil-now)/1000)+' วินาที'; return; }
      if(inp.value===S.pin){ S.pinFails=0; closeDialog(ov); resolve(true); }
      else{
        S.pinFails++; if(S.pinFails>=5){ S.pinLockUntil=now+30000; S.pinFails=0; }
        $('#pin-err',ov).textContent='รหัสไม่ถูกต้อง'; inp.value=''; inp.focus();
      }
    }
    $('#pin-ok',ov).onclick=ok;
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') ok(); });
    $('#pin-cancel',ov).onclick=function(){ closeDialog(ov); resolve(false); };
  });
}

/* =====================================================================
   answers: ชนิดคำถาม + ตรวจคำตอบ
   ===================================================================== */
/* รองรับชนิดคำถาม (คอลัมน์ q.type ไม่จำเป็น — เดาจาก choices ได้เหมือนเดิม):
   choice  เลือก 1 ข้อ (มี choices)
   multi   เลือกหลายข้อ   → correct_answer คั่นด้วย ||   เช่น  "ก||ค"
   tf      ถูก/ผิด         → ไม่ต้องมี choices
   fill    เติมคำตอบ       → ตอบได้หลายแบบคั่นด้วย ||  เช่น  "0.5||1/2"  */
function choicesOf(q){
  var c=q.choices;
  if(typeof c==='string'){ try{ c=JSON.parse(c); }catch(e){ c=null; } }
  return (Array.isArray(c)&&c.length) ? c.map(String) : null;
}
function qType(q){
  var t=String(q.type||q.question_type||'').toLowerCase();
  var ch=choicesOf(q);
  if(t==='multi'||t==='multiple'||t==='checkbox') return ch?'multi':'fill';
  if(t==='tf'||t==='truefalse'||t==='true_false') return 'tf';
  if(t==='fill'||t==='text'||t==='short') return 'fill';
  return ch?'choice':'fill';
}
function optionsOf(q){ return choicesOf(q) || (qType(q)==='tf' ? ['ถูก','ผิด'] : null); }
function toArabic(s){ return String(s).replace(/[๐-๙]/g,function(c){ return String(c.charCodeAt(0)-3664); }); }
function normAns(s){ return toArabic(s==null?'':s).trim().toLowerCase().replace(/\s+/g,''); }
function plainNum(s){ var t=toArabic(s==null?'':s).trim().replace(/,/g,''); return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : null; }
function sameAns(a,b){
  if(normAns(a)===normAns(b)) return true;
  var x=plainNum(a), y=plainNum(b);          // 2.50 = 2.5, 1,000 = 1000 (เศษส่วนต้องตรงตัวเพราะบางข้อให้ตอบ "อย่างต่ำ")
  return x!==null && y!==null && Math.abs(x-y)<1e-9;
}
function splitAns(s){ return String(s==null?'':s).split('||').map(function(x){return x.trim();}).filter(function(x){return x!=='';}); }
function checkAnswer(q,sub){
  sub = sub==null?'':String(sub);
  if(sub.trim()==='') return false;
  var corr = q.correct_answer==null?'':String(q.correct_answer), t=qType(q);
  if(t==='multi'){
    var A=splitAns(sub).map(normAns).sort(), B=splitAns(corr).map(normAns).sort();
    return A.length===B.length && A.every(function(v,i){return v===B[i];});
  }
  if(t==='fill') return splitAns(corr).some(function(c){ return sameAns(sub,c); }) || sameAns(sub,corr);
  return sameAns(sub,corr);
}
function showCorrect(q){
  var t=qType(q), parts=splitAns(q.correct_answer);
  if(t==='multi') return parts.map(formatMath).join(' , ');
  if(t==='fill' && parts.length>1) return parts.map(formatMath).join(' &nbsp;หรือ&nbsp; ');
  return formatMath(q.correct_answer);
}
function showAnswer(q,sub){
  if(sub==null||String(sub).trim()==='') return '';
  return qType(q)==='multi' ? splitAns(sub).map(formatMath).join(' , ') : formatMath(sub);
}

function loadCatalog(){
  return Promise.all([
    sbGetAll('subjects?select=*&order=phase,order_no,id'),
    sbGetAll('topics?select=*&order=order_no,id'),
    sbGetAll('questions?select=id,topic_id,mode,set_name&order=id').catch(function(){ return sbGetAll('questions?select=id,topic_id,mode&order=id'); })
  ]).then(function(r){
    S.subjects=r[0]; S.topics=r[1]; S.qmeta=r[2]; S.qIndex={}; S.sets={};
    r[2].forEach(function(m){
      var name=m.set_name||'', key=m.mode+'~'+name, tid=String(m.topic_id);
      var arr=S.sets[tid]||(S.sets[tid]=[]), s=null;
      for(var i=0;i<arr.length;i++) if(arr[i].key===key){ s=arr[i]; break; }
      if(!s){ s={key:key,mode:m.mode,name:name,ids:[]}; arr.push(s); }
      s.ids.push(m.id); S.qIndex[m.id]={tid:tid,set:s};
    });
    Object.keys(S.sets).forEach(function(tid){
      S.sets[tid].sort(function(a,b){ return (modeMeta(a.mode).order-modeMeta(b.mode).order) || a.name.localeCompare(b.name,'th',{numeric:true}); });
    });
    S.catalogLoaded=true;
  });
}
function loadProgressFor(name){
  return sbGetAll('progress?student_name=eq.'+enc(name)+'&select=question_id,mode,submitted_answer,is_correct,revealed,updated_at&order=question_id,mode').then(function(rows){

}
function loadExamsFor(name){

function subjectById(id){ for(var i=0;i<S.subjects.length;i++) if(String(S.subjects[i].id)===String(id)) return S.subjects[i]; return null; }

/* statistics */
function setStats(set,ctx){
  ctx=ctx||S.me; var done=0,correct=0;
  set.ids.forEach(function(id){ var p=ctx.progress[id]; if(p && p.answer!==''){ done++; if(p.correct) correct++; } });
  return {total:set.ids.length,done:done,correct:correct};
}
function examRow(tid,set,ctx){
  ctx=ctx||S.me;
  for(var i=0;i<ctx.exams.length;i++){
    var r=ctx.exams[i]; if(String(r.topic_id)!==String(tid)) continue;
    if(r.meta && r.meta.set){ if(r.meta.set===set.key) return r; }
    else if(set.key==='exam~') return r;
  }
  return null;
}
function isSubmitted(tid,set,ctx){
  if(modeMeta(set.mode).instant) return false;
  ctx=ctx||S.me;
  if(examRow(tid,set,ctx)) return true;
  return set.ids.length>0 && set.ids.every(function(id){ var p=ctx.progress[id]; return p && p.revealed; });   // ข้อมูลเก่า
}
function setStatus(tid,set,ctx){
  var st=setStats(set,ctx);
  if(isSubmitted(tid,set,ctx)) return {kind:'submitted',st:st};
  if(st.done===0) return {kind:'new',st:st};
  if(st.done>=st.total && modeMeta(set.mode).instant) return {kind:'complete',st:st};
  return {kind:'progress',st:st};
}
function aggTopics(tids,ctx){
  var a={total:0,done:0,correct:0,byMode:{}};
  tids.forEach(function(tid){ (S.sets[String(tid)]||[]).forEach(function(s){
    var st=setStats(s,ctx); a.total+=st.total; a.done+=st.done; a.correct+=st.correct;
    var b=a.byMode[s.mode]||(a.byMode[s.mode]={total:0,done:0,correct:0}); b.total+=st.total; b.done+=st.done; b.correct+=st.correct;
  }); });
  return a;
}
function levelList(){
  var seen={}; Object.keys(LEVELS).forEach(function(k){ if(LEVELS[k].always) seen[k]=true; });
  S.subjects.forEach(function(s){ if(s.phase!=null) seen[s.phase]=true; });
  return Object.keys(seen).map(Number).filter(function(n){return !isNaN(n);}).sort(function(a,b){return a-b;});
}
function subjectsOfLevel(n){ return S.subjects.filter(function(s){ return Number(s.phase)===Number(n); }); }
function topicsOfSubject(id){ return S.topics.filter(function(t){ return String(t.subject_id)===String(id); }).sort(function(a,b){ return (a.order_no||0)-(b.order_no||0); }); }
function tidsOfLevel(n){ var o=[]; subjectsOfLevel(n).forEach(function(s){ topicsOfSubject(s.id).forEach(function(t){ o.push(t.id); }); }); return o; }

var pending={};
function saveProgressRow(q,student,rec){
  syncStart();
  return sbUpsert('progress',{student_name:student,question_id:q.id,mode:q.mode,submitted_answer:rec.answer,is_correct:!!rec.correct,revealed:!!rec.revealed,updated_at:new Date().toISOString()},'student_name,question_id,mode')
    .then(function(){ syncEnd(true); }, function(e){ syncEnd(false); throw e; });
}
function setAnswer(q,value,immediate){
  var prev=S.me.progress[q.id]||{revealed:false};
  var rec={answer:value,correct:checkAnswer(q,value),revealed:!!prev.revealed,mode:q.mode,updated:new Date().toISOString()};
  S.me.progress[q.id]=rec;
  paintNav();
  clearTimeout(pending[q.id]&&pending[q.id].t);
  var run=function(){ delete pending[q.id]; saveProgressRow(q,S.student,rec).catch(function(){}); };
  if(immediate){ run(); return; }
  pending[q.id]={t:setTimeout(run,600),run:run};
}
function flushAll(){
  Object.keys(pending).forEach(function(k){ var p=pending[k]; clearTimeout(p.t); p.run(); });
  if(curPad) curPad.flush();
}

   ===================================================================== */
function parseHash(){
  var raw=(location.hash||'#/home').slice(1), qi=raw.indexOf('?'), path=qi>=0?raw.slice(0,qi):raw, qs=qi>=0?raw.slice(qi+1):'';
  var seg=path.split('/').filter(Boolean).map(function(x){ try{return decodeURIComponent(x);}catch(e){return x;} });
  var q={}; qs.split('&').forEach(function(p){ if(!p) return; var kv=p.split('='); try{ q[kv[0]]=decodeURIComponent(kv[1]||''); }catch(e){} });
  return {seg:seg,q:q};
}
function nav(hash){ if(location.hash===hash) route(); else location.hash=hash; }
function setLoading(msg){ app.innerHTML='<div class="loading"><div class="spinner"></div>'+h(msg||'กำลังโหลด…')+'</div>'; }
function route(){
  var my=++S.token;
  flushAll(); curPad=null;
  if(S.timerId){ clearInterval(S.timerId); S.timerId=null; }
  var loc=parseHash(), seg=loc.seg;
  renderTopbar();
  window.scrollTo(0,0);
  var p=Promise.resolve();
  return p.then(function(){
    if(seg[0]==='config') return viewConfig();
    if(!S.cfg) return viewConfig();
    if(!S.catalogLoaded){ setLoading(); return loadCatalog(); }
  }).then(function(){
    if(my!==S.token || seg[0]==='config' || !S.cfg) return;
    if(!S.student || seg[0]==='name') return viewName();
    if(S.dataFor!==S.student){ setLoading(); return loadStudentData(S.student).then(function(){ return my===S.token; }); }
    return true;
  }).then(function(go){
    if(go===undefined || go===false || my!==S.token) return;
    var seg0=seg[0];
    if(seg0==='subject') return viewSubject(seg[1]);
    if(seg0==='play') return viewPlay(seg[1],seg[2],parseInt(seg[3],10)||0,my);
    if(seg0==='result') return viewResult(seg[1],seg[2],my);
    if(seg0==='review') return viewReview(loc.q,my);
    if(seg0==='dashboard') return viewDashboard(my);
    return viewHome();
  }).catch(function(e){ if(my===S.token) viewError(e); });
}

/* =====================================================================
   view: home
   ===================================================================== */
function ring(p,size,label){
  var r=(size-12)/2, c=2*Math.PI*r, off=c*(1-Math.min(100,p)/100), m=size/2;
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle class="ring-bg" cx="'+m+'" cy="'+m+'" r="'+r+'" stroke-width="9"/><circle class="ring-fg" cx="'+m+'" cy="'+m+'" r="'+r+'" stroke-width="9" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+m+' '+m+')"/><text x="'+m+'" y="'+(m+6)+'" text-anchor="middle" font-size="'+Math.round(size/4)+'">'+label+'</text></svg>';
}
function segBar(st,showC){
  var t=st.total||1;
  if(!showC) return bar(pct(st.done,st.total),'accent');
  return '<div class="bar seg3"><i class="g" style="width:'+(st.correct/t*100)+'%"></i><i class="r" style="width:'+((st.done-st.correct)/t*100)+'%"></i></div>';
}
function statText(st,showC,submitted){
  if(st.done===0) return st.total+' ข้อ · <b>ยังไม่ได้ทำ</b>';
  return (submitted?'ส่งแล้ว · ':'')+'ทำแล้ว <b>'+st.done+'</b>/'+st.total+' · ยังไม่ทำ <b>'+(st.total-st.done)+'</b>'+
    (showC?'<br><span style="color:var(--good);font-weight:700">✓ ถูก '+st.correct+'</span> · <span style="color:var(--bad);font-weight:700">✗ ผิด '+(st.done-st.correct)+'</span>':'');
}
function bar(p,cls){ return '<div class="bar '+(cls||'')+'"><i style="width:'+Math.min(100,p)+'%"></i></div>'; }
function modePills(by,chk){
  return Object.keys(by).sort(function(a,b){return modeMeta(a).order-modeMeta(b).order;}).map(function(m){
    var b=by[m], mm=modeMeta(m);
    return '<span class="pill '+(b.total>0&&b.done>=b.total?'good':'')+'">'+mm.icon+' '+b.done+'/'+b.total+(chk&&b.done>0?' · ถูก '+pct(b.correct,b.done)+'%':'')+'</span>';
  }).join('');
}
function findContinue(){
  var rows=Object.keys(S.me.progress).map(function(id){ return {id:id,p:S.me.progress[id]}; }).filter(function(r){ return r.p.updated && r.p.answer!==''; });
  rows.sort(function(a,b){ return String(b.p.updated).localeCompare(String(a.p.updated)); });
  for(var i=0;i<rows.length;i++){
    var ix=S.qIndex[rows[i].id]; if(!ix) continue;
    var stt=setStatus(ix.tid,ix.set).kind;
    if(stt==='progress') return {tid:ix.tid,set:ix.set};
  }
  return null;
}

  html+='<div class="card hero">'+ring(p,96,p+'%')+'<div class="grow"><div class="muted small">'+h(li.icon+' '+li.name)+'</div><h2>สวัสดี '+h(S.student)+'</h2>'+
    '<div class="muted">ทำแล้ว <b>'+agg.done+'</b> จาก '+agg.total+' ข้อ'+(chk&&agg.done?' · ถูก '+pct(agg.correct,agg.done)+'%':'')+'</div>'+
    '<div class="row" style="margin-top:10px">'+contHtml+(chk&&agg.done?'<a class="btn btn-ghost" href="#/review?t='+enc(tids.join(','))+'&label='+enc(li.name)+'&st='+enc(S.student)+'">🔍 ดูข้อที่ผิดทั้งระดับ</a>':'')+'</div></div></div>';
  if(!subs.length){
    html+='<div class="empty card">ยังไม่มีเนื้อหาในระดับนี้<br><span class="small">เพิ่มวิชาในตาราง subjects ด้วย phase = '+S.level+' แล้วจะปรากฏที่นี่</span></div>';
  } else {
    html+='<div class="grid">'+subs.map(function(s){
      var ts=topicsOfSubject(s.id).map(function(t){return t.id;}), a=aggTopics(ts), sp=pct(a.done,a.total);

        '<div class="pills">'+modePills(a.byMode,chk)+(chk&&a.done?'<button class="pill bad" style="border:0;cursor:pointer" data-act="go" data-href="#/review?t='+enc(ts.join(','))+'&label='+enc(s.name_th)+'&st='+enc(S.student)+'">🔍 ข้อที่ผิด</button>':'')+'</div></div>';
    }).join('')+'</div>';

function viewSubject(sid){
  var s=subjectById(sid); if(!s){ location.hash='#/home'; return; }
  S.level=Number(s.phase)||S.level; store.set('level',S.level);
  var topics=topicsOfSubject(sid), chk=isChecker();
  var html='<div class="crumbs"><a href="#/home">หน้าแรก</a> › <span>'+h(levelInfo(s.phase).short)+'</span> › <b>'+h(s.name_th)+'</b></div>'+
    '<div class="spread" style="margin-bottom:12px"><h2 class="page">'+subjectIcon(s.name_th)+' '+h(s.name_th)+'</h2></div>';
  if(topics.length>7) html+='<div class="search no-print"><input type="text" id="tsearch" placeholder="🔎 ค้นหาเรื่อง…" autocomplete="off"></div>';
  html+='<div id="tlist">'+topics.map(function(t,i){
    var sets=S.sets[String(t.id)]||[], a=aggTopics([t.id]), tp=pct(a.done,a.total);
    var body=sets.length ? '<div class="sets">'+sets.map(function(set){
      var m=modeMeta(set.mode), stt=setStatus(t.id,set), st=stt.st, sp=pct(st.done,st.total), go, cls='s-'+stt.kind, sub;
      var href = (stt.kind==='submitted'||stt.kind==='complete') ? '#/result/'+enc(t.id)+'/'+enc(set.key) : '#/play/'+enc(t.id)+'/'+enc(set.key)+'/0';
      var showC = chk || SHOW_CORRECT_TO_STUDENT || stt.kind==='submitted';
      if(stt.kind==='submitted') go='ดูผล'; else if(stt.kind==='new') go='เริ่ม'; else if(stt.kind==='complete') go='ทบทวน'; else go=m.instant?'ทำต่อ':'ทำต่อ / ส่ง';
      sub=statText(st,showC,stt.kind==='submitted');
      return '<div class="setbox"><a class="setbtn '+cls+'" href="'+href+'"><span class="ic">'+m.icon+'</span><span class="grow"><span class="lbl">'+h(setLabel(set,t.id))+'</span><br><span class="sub">'+sub+'</span></span><span class="go">'+go+'</span></a>'+segBar(st,showC)+
        (chk&&st.done?'<div class="tools"><a class="btn btn-sm btn-soft" href="#/review?t='+enc(t.id)+'&set='+enc(set.key)+'&label='+enc(t.name_th+' · '+setLabel(set,t.id))+'&st='+enc(S.student)+'">🔍 ข้อที่ผิด ('+(st.done-st.correct)+')</a></div>':'')+'</div>';
    }).join('')+'</div>' : '<div class="muted small">ยังไม่มีข้อในเรื่องนี้</div>';
    return '<div class="topic" data-name="'+h((t.name_th||'').toLowerCase())+'"><div class="t-head"><div class="num">'+(i+1)+'</div><div class="t-name grow">'+h(t.name_th)+'</div><div class="t-prog"><span class="small muted">ทำแล้ว '+a.done+'/'+a.total+(chk&&a.done?' · ถูก '+a.correct:'')+'</span>'+bar(tp)+'</div></div>'+body+'</div>';
  }).join('')+'</div>';
  if(!topics.length) html+='<div class="empty card">ยังไม่มีเรื่องในวิชานี้</div>';
  app.innerHTML=html;
  var ts=$('#tsearch'); if(ts) ts.addEventListener('input',function(){ var v=ts.value.trim().toLowerCase(); $$('.topic').forEach(function(el){ el.style.display = (!v||el.getAttribute('data-name').indexOf(v)>=0)?'':'none'; }); });
}

/* =====================================================================
   view: player
   ===================================================================== */
function viewPlay(tid,key,idx,my){
  var set=findSet(tid,key), t=topicById(tid);
  if(!set||!t){ location.hash='#/home'; return; }
  if(isSubmitted(tid,set)){ location.replace('#/result/'+enc(tid)+'/'+enc(key)); return; }
  return loadSetQuestions(tid,set).then(function(qs){
    if(my!==S.token) return;
    if(!qs.length){ toast('ยังไม่มีข้อในชุดนี้'); location.hash='#/subject/'+enc(t.subject_id); return; }
    var i;
    if(idx<=0){ i=0; for(var k=0;k<qs.length;k++){ var p=S.me.progress[qs[k].id]; if(!p||p.answer===''){ i=k; break; } } }
    else i=Math.min(qs.length,idx)-1;
    var instant=modeMeta(set.mode).instant;
    if(!S.timers[tid+'|'+key]) S.timers[tid+'|'+key]=Date.now();
    S.P={tid:tid,key:key,set:set,topic:t,qs:qs,i:i,instant:instant,hidden:{}};
    paintPlayer();
  });
}
function paintNav(){
  if(!S.P) return;
  $$('.nc').forEach(function(el){
    var i=+el.getAttribute('data-i'), q=S.P.qs[i], p=S.me.progress[q.id];
    var c='nc'; if(i===S.P.i) c+=' cur';
    if(p && p.answer!==''){ c+= (S.P.instant && p.revealed) ? (p.correct?' ok':' no') : ' done'; }
    el.className=c;
  });
}
function paintPlayer(){
  var P=S.P, q=P.qs[P.i], t=P.topic, m=modeMeta(P.set.mode), n=P.qs.length, ty=qType(q);

  var hint = ty==='multi'?'เลือกได้หลายข้อ':ty==='fill'?'พิมพ์คำตอบ':ty==='tf'?'ถูก หรือ ผิด':'เลือก 1 ข้อ';
  var html='<div class="crumbs"><a href="#/home">หน้าแรก</a> › <a href="#/subject/'+enc(t.subject_id)+'">'+h((subjectById(t.subject_id)||{}).name_th||'วิชา')+'</a> › <b>'+h(t.name_th)+'</b></div>'+
    '<div class="player-head"><div><h2>'+m.icon+' '+h(setLabel(P.set,P.tid))+'</h2><div class="muted small">'+h(t.name_th)+'</div></div><div class="row">'+
    (!P.instant?'<span class="pill brand" id="timer">⏱ 00:00</span><button class="btn btn-sm btn-accent" data-act="submit-exam">ส่งข้อสอบ</button>':'')+'</div></div>'+
    '<div class="navchips no-print">'+P.qs.map(function(x,i){ return '<a class="nc" data-i="'+i+'" href="'+base+(i+1)+'">'+(i+1)+'</a>'; }).join('')+'</div>'+
    '<div class="player-grid"><section class="qcol"><div class="card"><div class="spread"><b style="font-family:var(--fh)">ข้อ '+(P.i+1)+' / '+n+'</b><span class="pill">'+hint+'</span></div><div style="height:10px"></div>'+
    '<div class="q-text">'+formatMath(q.question_text)+'</div>'+(q.question_svg?'<div class="q-svg">'+q.question_svg+'</div>':'')+(q.image_url?'<div class="q-svg"><img src="'+h(q.image_url)+'" alt=""></div>':'')+
    '<div id="answer"></div><div id="reveal"></div></div></section>'+
    '<aside class="padcol"><div class="card padcard" id="padcard"><div class="pad-head"><b>🖊️ กระดาษทด</b><div class="pad-tools"><button class="tool on" data-tool="pen" title="ปากกา">✒️</button><button class="tool" data-tool="eraser" title="ยางลบ">🧽</button><button class="tool" data-tool="undo" title="ย้อนกลับ">↩️</button><button class="tool" data-tool="clear" title="ล้างทั้งหมด">🗑️</button></div></div>'+
    '<div class="pad-scroll"><canvas class="pad"></canvas></div><div class="pad-foot"><span class="save-hint">พร้อมจด</span><span>ปากกา/นิ้วเดียว = เขียน · สองนิ้ว = เลื่อนหน้า</span></div></div></aside></div>'+
    '<div class="navbar"><div class="wrap"><a class="btn btn-ghost" '+(P.i===0?'style="visibility:hidden"':'')+' href="'+base+P.i+'">← ก่อนหน้า</a><span class="muted small">'+(P.i+1)+' / '+n+'</span>'+
    (P.i===n-1 ? (P.instant ? '<a class="btn btn-primary" href="#/subject/'+enc(t.subject_id)+'">เสร็จสิ้น ✓</a>' : '<button class="btn btn-accent" data-act="submit-exam">ส่งข้อสอบ</button>') : '<a class="btn btn-primary" href="'+base+(P.i+2)+'">ถัดไป →</a>')+'</div></div>';
  app.innerHTML=html;
  paintNav(); paintAnswer(q); paintReveal(q); mountPad(q);
  var cur=$('.nc.cur'); if(cur&&cur.scrollIntoView){ try{ cur.scrollIntoView({block:'nearest',inline:'center'}); }catch(e){} }
  if(!P.instant){
    var tick=function(){ var el=$('#timer'); if(!el) return; var s=Math.floor((Date.now()-S.timers[P.tid+'|'+P.key])/1000); el.textContent='⏱ '+('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2); };
    tick(); S.timerId=setInterval(tick,1000);

function paintAnswer(q){
  var box=$('#answer'), P=S.P, p=S.me.progress[q.id], saved=p?p.answer:'', ty=qType(q), locked=P.instant&&p&&p.revealed;
  var html='';
  if(ty==='fill'){
    html='<div style="margin-top:14px"><input type="text" class="fill" id="fill" placeholder="พิมพ์คำตอบที่นี่" value="'+h(saved)+'" autocomplete="off" autocapitalize="off" spellcheck="false" '+(locked?'disabled':'')+'></div>';
  } else {
    var opts=optionsOf(q), sel=ty==='multi'?splitAns(saved):[saved];
    html=opts.map(function(c,i){
      var on=sel.indexOf(c)>=0;
      return '<div class="choice '+(ty==='multi'?'multi ':'')+(on?'sel ':'')+(locked?'lock':'')+'" data-act="choose" data-i="'+i+'"><span class="mk">'+(on?'✓':'')+'</span><span>'+formatMath(c)+'</span></div>';
    }).join('');
  }
  if(P.instant && !locked){
    html+='<button class="btn btn-accent" style="margin-top:16px" data-act="reveal">'+(isChecker()?'✔ ตรวจคำตอบ / ดูเฉลย':'🔒 ตรวจคำตอบ (ผู้ตรวจ)')+'</button>';
  }
  box.innerHTML=html;
  var f=$('#fill'); if(f&&!locked) f.addEventListener('input',function(){ setAnswer(q,f.value); });
}
function paintReveal(q){
  var box=$('#reveal'), P=S.P, p=S.me.progress[q.id]; if(!box) return;
  if(!P.instant || !p || !p.revealed){ box.innerHTML=''; return; }
  if(P.hidden[q.id]){ box.innerHTML='<button class="btn btn-ghost btn-sm" style="margin-top:12px" data-act="rv-show">👁️ แสดงเฉลยอีกครั้ง</button>'; return; }
  var ok=p.correct, chk=isChecker();
  box.innerHTML='<div class="reveal '+(ok?'good':'bad')+'"><div class="spread"><div class="verdict">'+(ok?'✓ ถูกต้อง!':'✗ ยังไม่ถูก')+'</div><button class="btn btn-sm btn-ghost" data-act="rv-hide">ซ่อน</button></div>'+
    '<div style="margin-top:6px">เฉลย: <b>'+showCorrect(q)+'</b></div>'+(q.explanation?'<div class="exp">'+formatMath(q.explanation)+'</div>':'')+(q.explanation_svg?'<div class="q-svg">'+q.explanation_svg+'</div>':'')+
    (chk?'<div class="tools"><span class="small muted" style="align-self:center">ผู้ตรวจ:</span><button class="btn btn-sm btn-ghost" data-act="override" data-v="1">ให้ถูก ✓</button><button class="btn btn-sm btn-ghost" data-act="override" data-v="0">ให้ผิด ✗</button><button class="btn btn-sm btn-ghost" data-act="retry-q">↺ ให้ทำข้อนี้ใหม่</button></div>':'')+'</div>';

/* ---- scratch pad (เก็บพฤติกรรมเดิมไว้: ปากกา/นิ้วเดียวเขียน สองนิ้วเลื่อน) ---- */
var curPad=null, padResizeFn=null;
function drawStroke(ctx,s){
  if(!s.points||!s.points.length) return;
  ctx.globalCompositeOperation = s.tool==='eraser'?'destination-out':'source-over';
  ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=s.color; ctx.fillStyle=s.color; ctx.lineWidth=s.width;
  var pts=s.points;
  if(pts.length===1){ ctx.beginPath(); ctx.arc(pts[0][0],pts[0][1],s.width/2,0,Math.PI*2); ctx.fill(); return; }
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length-1;i++){ ctx.quadraticCurveTo(pts[i][0],pts[i][1],(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2); }
  ctx.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]); ctx.stroke();
}
function mountPad(q){
  var root=$('#padcard'); if(!root) return;
  var canvas=$('canvas',root), box=$('.pad-scroll',root), hint=$('.save-hint',root), ctx=canvas.getContext('2d');
  var strokes=[], drawing=false, tool='pen', cur=null, last=null, saveTimer=null, dirty=false;
  var PEN='#1f2937', ERASER=22, VIEW=Math.max(380,box.clientHeight||480), canvasH=VIEW*2, CHUNK=VIEW, MAXH=VIEW*8, MARGIN=60;
  function fit(keep){
    var top=box.scrollTop, w=box.getBoundingClientRect().width||600, dpr=window.devicePixelRatio||1;
    canvas.style.height=canvasH+'px'; canvas.width=Math.max(1,w*dpr); canvas.height=Math.max(1,canvasH*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); redraw(); if(keep) box.scrollTop=top;
  }
  function redraw(){ ctx.clearRect(0,0,canvas.width,canvas.height); strokes.forEach(function(s){ drawStroke(ctx,s); }); if(cur) drawStroke(ctx,cur); }
  function pos(e){ var r=canvas.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
  function widthFor(e){ if(tool==='eraser') return ERASER; if(e.pointerType==='pen'&&e.pressure>0) return 1.6+e.pressure*2.6; return 2.6; }
  function grow(p){ if(p[1]>canvasH-MARGIN && canvasH<MAXH){ canvasH=Math.min(MAXH,canvasH+CHUNK); fit(true); return true; } return false; }
  function schedule(){ dirty=true; hint.textContent='กำลังบันทึก…'; clearTimeout(saveTimer); saveTimer=setTimeout(save,700); }
  function save(){
    saveTimer=null; if(!dirty) return; dirty=false; syncStart();
    sbUpsert('scratch_pads',{student_name:S.student,question_id:q.id,mode:q.mode,strokes:strokes,updated_at:new Date().toISOString()},'student_name,question_id,mode')
      .then(function(){ syncEnd(true); hint.textContent='บันทึกแล้ว ✓'; }, function(){ syncEnd(false); dirty=true; hint.textContent='บันทึกไม่สำเร็จ'; });
  }
  function start(pt){
    drawing=true; var p=pos(pt), w=widthFor(pt);
    cur={tool:tool,color:tool==='eraser'?'#000000':PEN,width:w,points:[p]}; last=p; grow(p);
    ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over'; ctx.fillStyle=cur.color;
    ctx.beginPath(); ctx.arc(p[0],p[1],w/2,0,Math.PI*2); ctx.fill();
    ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=cur.color; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(p[0],p[1]);
  }
  function move(pt){
    if(!drawing) return; var p=pos(pt);
    if(grow(p)){ ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over'; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=cur.color; ctx.lineWidth=cur.width; ctx.beginPath(); ctx.moveTo(last[0],last[1]); }
    var mx=(last[0]+p[0])/2, my=(last[1]+p[1])/2;
    ctx.quadraticCurveTo(last[0],last[1],mx,my); ctx.stroke(); ctx.beginPath(); ctx.moveTo(mx,my);
    cur.points.push(p); last=p;
  }
  function end(){ if(!drawing) return; drawing=false; if(cur&&cur.points.length){ strokes.push(cur); schedule(); } cur=null; last=null; }
  function cancel(){ drawing=false; cur=null; last=null; redraw(); }
  canvas.addEventListener('pointerdown',function(e){ if(e.pointerType==='touch') return; e.preventDefault(); try{ canvas.setPointerCapture(e.pointerId); }catch(x){} start(e); });
  canvas.addEventListener('pointermove',function(e){ if(e.pointerType==='touch') return; e.preventDefault(); move(e); });
  ['pointerup','pointerleave','pointercancel'].forEach(function(n){ canvas.addEventListener(n,function(e){ if(e.pointerType!=='touch') end(); }); });
  var panning=false, panY=0, panTop=0;
  function avgY(tl){ var s=0,n=Math.min(2,tl.length); for(var i=0;i<n;i++) s+=tl[i].clientY; return n?s/n:0; }
  canvas.addEventListener('touchstart',function(e){
    e.preventDefault();
    if(e.touches.length===1) start(e.touches[0]);
    else if(e.touches.length>=2){ if(drawing) cancel(); panning=true; panY=avgY(e.touches); panTop=box.scrollTop; }
  },{passive:false});
  canvas.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(panning&&e.touches.length>=2){ var max=Math.max(0,canvasH-box.clientHeight); box.scrollTop=Math.min(max,Math.max(0,panTop-(avgY(e.touches)-panY))); return; }
    if(e.touches.length===1&&drawing) move(e.touches[0]);
  },{passive:false});
  function tEnd(e){ e.preventDefault(); if(e.touches.length<2) panning=false; if(e.touches.length===0) end(); }
  canvas.addEventListener('touchend',tEnd,{passive:false}); canvas.addEventListener('touchcancel',tEnd,{passive:false});
  canvas.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  $$('.tool',root).forEach(function(b){ b.onclick=function(){
    var t=b.getAttribute('data-tool');
    if(t==='pen'||t==='eraser'){ tool=t; $$('.tool',root).forEach(function(x){ x.classList.toggle('on',x.getAttribute('data-tool')===t); }); }
    else if(t==='undo'){ strokes.pop(); redraw(); schedule(); }
    else if(t==='clear'){
      if(!strokes.length) return;
      confirmDialog('ล้างกระดาษทดข้อนี้?','เส้นที่เขียนไว้ทั้งหมดจะหายไป','ล้าง',true).then(function(ok){ if(ok){ strokes=[]; canvasH=VIEW*2; fit(); box.scrollTop=0; schedule(); } });
    }
  }; });
  if(padResizeFn) window.removeEventListener('resize',padResizeFn);
  padResizeFn=function(){ fit(true); }; window.addEventListener('resize',padResizeFn);
  curPad={flush:function(){ if(saveTimer){ clearTimeout(saveTimer); } if(dirty) save(); }};
  hint.textContent='กำลังโหลดกระดาษทด…'; fit();
  sbGet('scratch_pads?student_name=eq.'+enc(S.student)+'&question_id=eq.'+enc(q.id)+'&mode=eq.'+enc(q.mode)+'&select=strokes').then(function(rows){
    if(rows&&rows[0]&&rows[0].strokes&&rows[0].strokes.length){
      strokes=rows[0].strokes.concat(strokes);
      var maxY=VIEW*2; strokes.forEach(function(s){ (s.points||[]).forEach(function(p){ if(p[1]>maxY) maxY=p[1]; }); });
      canvasH=Math.min(MAXH,Math.ceil((maxY+40)/CHUNK)*CHUNK); fit(); hint.textContent='โหลดกระดาษทดเดิมแล้ว';
    } else hint.textContent='พร้อมจด';
  }).catch(function(){ hint.textContent='พร้อมจด (ออฟไลน์)'; });
}

function submitExam(){
  var P=S.P; if(!P) return;
  flushAll();
  var unanswered=P.qs.filter(function(q){ var p=S.me.progress[q.id]; return !p||p.answer===''; }).length;
  confirmDialog('ส่งข้อสอบ?', unanswered?('ยังไม่ได้ตอบ '+unanswered+' ข้อ — ส่งแล้วจะแก้ไม่ได้'):'ตอบครบทุกข้อแล้ว — ส่งแล้วจะแก้ไม่ได้','ส่งข้อสอบ').then(function(ok){
    if(!ok) return;
    var correct=0, log={};
    var saves=P.qs.map(function(q){
      var p=S.me.progress[q.id]||{answer:'',correct:false,revealed:false,mode:q.mode};
      var c=checkAnswer(q,p.answer); p.correct=c; S.me.progress[q.id]=p; if(c) correct++;
      log[q.id]={submitted:p.answer,correct:c};
      return saveProgressRow(q,S.student,p).catch(function(){});
    });
    log._meta={set:P.key};
    Promise.all(saves).then(function(){
      syncStart();
      return sbInsert('exam_results',{student_name:S.student,topic_id:P.tid,score:correct,total:P.qs.length,answers:log}).then(function(){ syncEnd(true); },function(){ syncEnd(false); toast('ส่งแล้ว แต่บันทึกประวัติไม่สำเร็จ'); });
    }).then(function(){
      S.me.exams.unshift({topic_id:P.tid,score:correct,total:P.qs.length,created_at:new Date().toISOString(),meta:{set:P.key}});
      location.hash='#/result/'+enc(P.tid)+'/'+enc(P.key);
    });
  });
}

  var html='<div class="crumbs"><a href="#/home">← กลับหน้าแรก</a></div><div class="spread"><div><h2 class="page">📊 ภาพรวมผลการเรียน</h2><div class="muted small">สำหรับผู้ปกครอง / ครู</div></div>'+
    '<div class="row no-print"><div style="min-width:200px"><select data-change="dash-student">'+S.D.students.map(function(n){ return '<option value="'+h(n)+'" '+(n===ds?'selected':'')+'>👤 '+h(n)+'</option>'; }).join('')+'</select></div><button class="btn btn-ghost" data-act="print">🖨️ พิมพ์</button></div></div><div style="height:14px"></div>';
  html+='<div class="kpis"><div class="kpi"><div class="v">'+all.done+'<span class="muted" style="font-size:16px">/'+all.total+'</span></div><div class="l">ข้อที่ทำแล้ว ('+pct(all.done,all.total)+'%)</div></div>'+
    '<div class="kpi"><div class="v">'+(all.done?pct(all.correct,all.done)+'%':'—')+'</div><div class="l">ความแม่นยำรวม ('+all.correct+'/'+all.done+' ข้อ)</div></div>'+
    '<div class="kpi"><div class="v">'+subm+'</div><div class="l">ชุดข้อสอบที่ส่งแล้ว</div></div>'+
    '<div class="kpi"><div class="v" style="font-size:20px;padding-top:6px">'+(last?fmtDate(last,{day:'numeric',month:'short'})+' '+fmtTime(last):'—')+'</div><div class="l">ทำล่าสุด</div></div></div>';
  html+='<div class="tabs no-print">'+levels.map(function(n){ var i=levelInfo(n); return '<button class="tab '+(n===S.level?'on':'')+'" data-act="level-dash" data-v="'+n+'"><span class="ic">'+i.icon+'</span><span>'+h(i.short)+'</span></button>'; }).join('')+'</div>';
  var subs=subjectsOfLevel(S.level);
  if(!subs.length) html+='<div class="empty card">ยังไม่มีเนื้อหาในระดับนี้</div>';
  subs.forEach(function(sj){
    var ts=topicsOfSubject(sj.id), a=aggTopics(ts.map(function(t){return t.id;}),ctx);
    html+='<div class="card"><div class="spread"><h3>'+subjectIcon(sj.name_th)+' '+h(sj.name_th)+'</h3><span class="pill brand">'+a.done+'/'+a.total+' ข้อ'+(a.done?' · ถูก '+pct(a.correct,a.done)+'%':'')+'</span></div>';
    ts.forEach(function(t){
      var sets=S.sets[String(t.id)]||[], ta=aggTopics([t.id],ctx), acc=ta.done?pct(ta.correct,ta.done):null, weak=ta.done>=3&&acc<60;
      html+='<div class="drow"><div class="spread"><b>'+h(t.name_th)+'</b><div class="row">'+(weak?'<span class="pill bad">ควรทบทวน</span>':'')+(acc!==null?'<span class="pill '+(acc>=80?'good':acc>=60?'warn':'bad')+'">ถูก '+acc+'%</span>':'<span class="pill">ยังไม่เริ่ม</span>')+'<button class="btn btn-sm btn-danger no-print" data-act="reset-topic" data-tid="'+h(t.id)+'" data-name="'+h(t.name_th)+'" data-student="'+h(ds)+'">ล้าง</button></div></div>'+
        '<div class="dsets">'+sets.map(function(set){
          var st=setStats(set,ctx), sub=isSubmitted(t.id,set,ctx), m=modeMeta(set.mode);
          return '<div class="dset"><div class="spread"><span class="small"><b>'+m.icon+' '+h(setLabel(set,t.id))+'</b></span><span class="small muted">'+st.done+'/'+st.total+(sub?' · ส่งแล้ว':'')+'</span></div>'+bar(pct(st.done,st.total))+
            '<div class="spread" style="margin-top:6px"><span class="tiny muted">'+(st.done?'ถูก '+st.correct+' / ผิด '+(st.done-st.correct):'—')+'</span>'+(st.done?'<a class="btn btn-sm btn-soft no-print" href="#/review?t='+enc(t.id)+'&set='+enc(set.key)+'&label='+enc(t.name_th+' · '+setLabel(set,t.id))+'&st='+enc(ds)+'">🔍 ดูข้อ</a>':'')+'</div></div>';
        }).join('')+'</div></div>';
    });
    html+='</div>';
  });
  if(ctx.exams.length){
    html+='<div class="card"><h3 style="margin-bottom:8px">ประวัติการส่งข้อสอบ</h3>'+ctx.exams.slice(0,15).map(function(r){
      var tn=(topicById(r.topic_id)||{}).name_th||r.topic_id, set=r.meta&&r.meta.set?r.meta.set.split('~'):['exam',''];
      return '<div class="list-line"><span>'+h(tn)+' <span class="muted small">· '+h(modeMeta(set[0]).label+(set[1]?' '+set[1]:''))+'</span></span><span class="muted" style="white-space:nowrap">'+fmtDate(r.created_at)+' · <b>'+r.score+'/'+r.total+'</b></span></div>';
    }).join('')+'</div>';
  }
  var act=Object.keys(ctx.progress).map(function(id){ return {id:id,p:ctx.progress[id]}; }).filter(function(r){ return r.p.answer!==''&&r.p.updated&&S.qIndex[r.id]; }).sort(function(a,b){ return String(b.p.updated).localeCompare(String(a.p.updated)); }).slice(0,30);
  if(act.length){
    var lastD=null;
    html+='<div class="card"><h3>🕒 กิจกรรมล่าสุด</h3><div class="muted small" style="margin-bottom:6px">ทำข้อไหน วันไหน เวลาไหน — '+h(ds)+'</div>'+act.map(function(r){
      var ix=S.qIndex[r.id], t=topicById(ix.tid)||{}, sj=subjectById(t.subject_id)||{}, d=fmtDate(r.p.updated,{weekday:'short',day:'numeric',month:'short'}), head='';
      if(d!==lastD){ head='<div style="font-family:var(--fh);font-weight:600;font-size:13px;color:var(--accent-d);margin-top:10px">'+h(d)+'</div>'; lastD=d; }
      return head+'<div class="list-line"><span>'+(r.p.correct?'✅':'❌')+' '+modeMeta(r.p.mode).icon+' '+h(sj.name_th||'')+' · '+h(t.name_th||'')+'</span><span class="muted" style="white-space:nowrap">'+fmtTime(r.p.updated)+' น.</span></div>';
    }).join('')+'</div>';
  }
  html+='<div class="card no-print"><h3 style="margin-bottom:6px">🔒 เปลี่ยนรหัสผู้ตรวจ</h3><p class="note" style="margin-bottom:12px">ตัวเลข 3–6 หลัก ใช้เข้าโหมดผู้ตรวจ (ดูเฉลย/ภาพรวม/ล้างข้อมูล)</p><div class="row"><div class="grow"><label class="lb">รหัสใหม่</label><input type="password" inputmode="numeric" maxlength="6" id="new-pin"></div><div class="grow"><label class="lb">ยืนยันรหัสใหม่</label><input type="password" inputmode="numeric" maxlength="6" id="confirm-pin"></div></div><div style="height:10px"></div><div class="row"><button class="btn btn-primary" data-act="save-pin">บันทึกรหัสใหม่</button><button class="btn btn-ghost" data-act="refresh">🔄 รีเฟรชข้อมูลทั้งหมด</button></div><div class="err" id="pin-msg"></div></div>';
  app.innerHTML=html;
}

/* =====================================================================
   actions (event delegation — เหมาะกับ iPad)
   ===================================================================== */
var actions = {
  go:function(el){ location.hash=el.getAttribute('data-href'); },
  retry:function(){ S.catalogLoaded=false; route(); },
  level:function(el){ S.level=Number(el.getAttribute('data-v')); store.set('level',S.level); viewHome(); },
  'level-dash':function(el){ S.level=Number(el.getAttribute('data-v')); store.set('level',S.level); var ds=S.D.student; paintDashboard(ds, ds===S.student?S.me:S.D.ctx[ds]); },
  'switch-student':function(){ location.hash='#/name'; },
  'name-go':function(){ var v=($('#nm')||{}).value; v=(v||'').trim(); if(v) setStudent(v); },
  'name-pick':function(el){ setStudent(el.getAttribute('data-name')); },
  'cfg-save':function(){
    var url=$('#cfg-url').value.trim().replace(/\/+$/,''), key=$('#cfg-key').value.trim();
    if(!url||!key){ $('#cfg-err').textContent='กรอกให้ครบทั้งสองช่อง'; return; }
    S.cfg={url:url,key:key}; store.set('supabase_config',S.cfg); S.catalogLoaded=false; nav('#/home');
  },
  'toggle-checker':function(){ if(isChecker()) lockChecker(); else requireChecker('ให้ผู้ปกครอง/ครูใส่รหัส เพื่อดูเฉลยและผลการเรียน').then(function(ok){ if(ok){ toast('เปิดโหมดผู้ตรวจแล้ว'); route(); } }); },
  'open-dashboard':function(){ nav('#/dashboard'); },
  choose:function(el){
    var q=curQ(), P=S.P; if(!q) return;
    var p=S.me.progress[q.id]; if(P.instant && p && p.revealed) return;
    var opts=optionsOf(q), c=opts[+el.getAttribute('data-i')], ty=qType(q), val;
    if(ty==='multi'){
      var cur=splitAns(p?p.answer:''), k=cur.indexOf(c); if(k>=0) cur.splice(k,1); else cur.push(c);
      val=opts.filter(function(o){ return cur.indexOf(o)>=0; }).join('||');
    } else val=c;
    setAnswer(q,val,true); paintAnswer(q);
  },
  reveal:function(){
    var q=curQ(); if(!q) return;
    requireChecker('ใส่รหัสเพื่อดูเฉลย').then(function(ok){
      if(!ok) return;
      var p=S.me.progress[q.id]||{answer:'',correct:false,mode:q.mode};
      p.revealed=true; p.correct=checkAnswer(q,p.answer); S.me.progress[q.id]=p; S.P.hidden[q.id]=false;
      saveProgressRow(q,S.student,p).catch(function(){});
      sbInsert('attempts',{student_name:S.student,question_id:q.id,submitted_answer:p.answer,is_correct:p.correct}).catch(function(){});
      paintAnswer(q); paintReveal(q); paintNav();
      var rv=$('#reveal .reveal'); if(rv&&rv.scrollIntoView){ try{ rv.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){ rv.scrollIntoView(); } }
    });
  },
  'rv-hide':function(){ var q=curQ(); S.P.hidden[q.id]=true; paintReveal(q); },
  'rv-show':function(){ var q=curQ(); S.P.hidden[q.id]=false; paintReveal(q); },
  override:function(el){ var q=curQ(); overrideRow(q,S.student,S.me,el.getAttribute('data-v')==='1').then(function(){ paintReveal(q); paintNav(); }); },
  'retry-q':function(){
    var q=curQ();
    confirmDialog('ให้ทำข้อนี้ใหม่?','ล้างคำตอบและเฉลยของข้อนี้ (กระดาษทดยังอยู่)','ล้างคำตอบ',true).then(function(ok){
      if(!ok) return;
      sbDelete('progress?student_name=eq.'+enc(S.student)+'&question_id=eq.'+enc(q.id)).then(function(){ delete S.me.progress[q.id]; paintAnswer(q); paintReveal(q); paintNav(); },function(){ toast('ล้างไม่สำเร็จ'); });
    });
  },
  'submit-exam':function(){ submitExam(); },
  'list-filter':function(el){ S.L.filter=el.getAttribute('data-v'); paintList(); },
  'row-unlock':function(){ requireChecker('ใส่รหัสเพื่อดูเฉลย').then(function(ok){ if(ok) paintList(); }); },
  'row-override':function(el){
    var id=el.getAttribute('data-q'), q=S.L.qs.filter(function(x){ return String(x.id)===id; })[0];
    overrideRow(q,S.L.student,S.L.ctx,el.getAttribute('data-v')==='1').then(function(){ paintList(); });
  },
  'row-pad':function(el){ var id=el.getAttribute('data-q'); S.L.pads[id]=S.L.pads[id]==='open'?'closed':'open'; if(S.L.pads[id]==='open') loadPadView(id); else document.getElementById('pv-'+id).innerHTML=''; },
  'reset-topic':function(el){
    var tid=el.getAttribute('data-tid'), nm=el.getAttribute('data-name'), st=el.getAttribute('data-student');
    confirmDialog('ล้างความคืบหน้า?','ล้างคำตอบ คะแนน และกระดาษทดทั้งหมดของ “'+nm+'” สำหรับ '+st+' — ย้อนกลับไม่ได้','ล้างข้อมูล',true).then(function(ok){
      if(!ok) return;
      resetTopic(tid,st).then(function(){ return st===S.student ? loadStudentData(S.student) : loadCtxFor(st).then(function(c){ S.D.ctx[st]=c; }); }).then(function(){ toast('ล้างเรียบร้อยแล้ว'); route(); },function(e){ toast('ล้างไม่สำเร็จ: '+e.message); });
    });
  },
  'save-pin':function(){
    var a=$('#new-pin').value.trim(), b=$('#confirm-pin').value.trim(), msg=$('#pin-msg'); msg.style.color='';
    if(!/^[0-9]{3,6}$/.test(a)){ msg.textContent='กรุณาใส่ตัวเลข 3–6 หลัก'; return; }
    if(a!==b){ msg.textContent='รหัสทั้งสองช่องไม่ตรงกัน'; return; }
    sbUpsert('app_settings',{id:1,pin:a,updated_at:new Date().toISOString()},'id').then(function(){ S.pin=a; msg.style.color='var(--good)'; msg.textContent='บันทึกรหัสใหม่แล้ว ✓'; $('#new-pin').value=''; $('#confirm-pin').value=''; },function(e){ msg.textContent='บันทึกไม่สำเร็จ: '+e.message; });
  },
  refresh:function(){ S.catalogLoaded=false; S.qcache={}; S.D={students:null,student:S.D.student,ctx:{}}; S.dataFor=null; route(); },
  print:function(){ window.print(); }
};
document.addEventListener('click',function(e){
  var el=e.target.closest ? e.target.closest('[data-act]') : null; if(!el) return;
  var fn=actions[el.getAttribute('data-act')]; if(fn){ e.preventDefault(); fn(el,e); }
});
document.addEventListener('change',function(e){
  var el=e.target; if(el.getAttribute && el.getAttribute('data-change')==='dash-student'){ S.D.student=el.value; route(); }
});

/* =====================================================================
   init
   ===================================================================== */
function init(){
  try{ var cu=+sessionStorage.getItem('m1:checkerUntil'); if(cu>Date.now()){ S.checkerUntil=cu; S.checkerWasOn=true; } }catch(e){}
  Promise.all([store.get('supabase_config'),store.get('student_name'),store.get('level')]).then(function(r){
    S.cfg=(r[0]&&r[0].url&&r[0].key)?r[0]:SUPABASE_DEFAULT; S.student=r[1]||''; if(r[2]) S.level=Number(r[2])||1;
    return sbGet('app_settings?id=eq.1&select=pin').then(function(rows){ if(rows&&rows[0]&&rows[0].pin) S.pin=String(rows[0].pin); }).catch(function(){});
  }).then(function(){ if(!location.hash) location.hash='#/home'; route(); });
}
init();
})();
</script>

</html>
